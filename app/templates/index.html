<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ingestor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0f0f; --panel:#1f1f1f; --hover:#272727; --line:#303030;
  --text:#f1f1f1; --mute:#aaa; --dim:#717171;
  --blue:#3ea6ff; --green:#2ba640; --yellow:#ffd60a; --red:#f28b82; --purple:#c58af9;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;display:flex;overflow:hidden}

/* sidebar */
aside{width:260px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative}
.logout-btn{
  position:absolute;top:14px;right:14px;z-index:2;
  width:30px;height:30px;border-radius:50%;
  background:transparent;border:1px solid transparent;color:var(--dim);
  cursor:pointer;display:grid;place-items:center;
  transition:all .15s;
}
.logout-btn:hover{background:var(--hover);color:var(--text);border-color:var(--line)}
.logout-btn svg{width:14px;height:14px}
.nav{display:flex;flex-direction:column;flex-shrink:0;padding-top:16px}
.nav button{
  background:none;border:0;color:var(--text);font:inherit;cursor:pointer;
  padding:9px 20px;text-align:left;display:flex;align-items:center;gap:10px;
  border-left:3px solid transparent;
}
.nav button:hover{background:var(--hover)}
.nav button.on{background:var(--hover);border-left-color:var(--blue);font-weight:500}
.nav .count{margin-left:auto;font-size:12px;color:var(--mute);background:var(--panel);padding:1px 8px;border-radius:10px;min-width:24px;text-align:center}
.nav .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.nav .dot.queued{background:var(--blue)}
.nav .dot.processing{background:var(--yellow)}
.nav .dot.done{background:var(--green)}
.nav .dot.failed{background:var(--red)}
.nav .dot.duplicate{background:var(--purple)}
.nav .dot.unsupported{background:var(--dim)}
.nav .dot.all{background:var(--text)}

.spacer{flex:1;min-height:8px}

/* live log */
.log{
  display:flex;flex-direction:column;min-height:0;
  border-top:1px solid var(--line);background:#0a0a0a;
}
.log-head{
  padding:8px 14px;font-size:11px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.08em;
  display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--line);
}
.log-head::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
.log-head.off::before{background:var(--dim);animation:none}
.log-head .clr{margin-left:auto;cursor:pointer;font-size:10px;color:var(--dim)}
.log-head .clr:hover{color:var(--text)}
.log-body{
  height:240px;overflow-y:auto;padding:6px 0;
  font:11px/1.5 ui-monospace,SF Mono,Consolas,monospace;
  scrollbar-width:thin;scrollbar-color:#333 transparent;
}
.log-body::-webkit-scrollbar{width:6px}
.log-body::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
.log-line{padding:1px 14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:slide .15s ease-out}
.log-line .ts{color:var(--dim);margin-right:6px}
.log-line .lvl{display:inline-block;width:30px;font-weight:600}
.log-line.INFO     .lvl{color:var(--blue)}
.log-line.WARNING  .lvl{color:var(--yellow)}
.log-line.ERROR    .lvl{color:var(--red)}
.log-line.DEBUG    .lvl{color:var(--dim)}
@keyframes slide{from{transform:translateX(-6px);opacity:0}}

@keyframes pulse{50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:translateY(-6px);opacity:0}}

/* main */
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:14px 24px;border-bottom:1px solid var(--line)}

/* live rate strip */
.rates{display:flex;gap:24px;padding:10px 24px;border-bottom:1px solid var(--line);background:#161616;align-items:center}
.rate{display:flex;align-items:baseline;gap:6px}
.rate .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text);min-width:34px}
.rate .u{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.rate .l{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-left:4px}
.rate .arrow{font-size:14px;margin-right:2px}
.rate.in .arrow{color:var(--blue)}
.rate.out .arrow{color:var(--green)}
.rate.act .v{color:var(--yellow)}
.rate.tput{margin-left:auto;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.rate.tput b{color:var(--mute);font-weight:500}
.spark{display:flex;align-items:flex-end;gap:1px;height:18px;margin-left:6px}
.spark span{width:3px;background:var(--line);border-radius:1px;transition:height .3s}
.rate.in .spark span.hot{background:var(--blue)}
.rate.out .spark span.hot{background:var(--green)}
.search{flex:1;max-width:480px;position:relative}
.search input{
  width:100%;background:var(--panel);border:1px solid transparent;border-radius:20px;
  padding:8px 14px 8px 38px;color:var(--text);font:inherit;
}
.search input:focus{outline:0;background:var(--bg);border-color:var(--line)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:.6}
.bulk{display:none;align-items:center;gap:8px;margin-left:auto;animation:pop .15s ease-out}
.bulk.show{display:flex}
.bulk .n{color:var(--mute);font-size:13px;margin-right:4px}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:6px 14px;border-radius:18px;cursor:pointer;font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn.r{color:var(--green);border-color:#2a4a32}
.btn.r:hover{background:#1a2a20}
.btn.d{color:var(--red);border-color:#4a2a2a}
.btn.d:hover{background:#2a1a1a}
.btn.s{padding:5px 14px;font-size:12px}

/* table */
.scroll{flex:1;overflow:auto}
table{width:100%;border-collapse:collapse}
thead{position:sticky;top:0;background:var(--bg);z-index:1}
th{text-align:left;padding:10px 16px;font-size:12px;font-weight:500;color:var(--mute);border-bottom:1px solid var(--line)}
th:first-child,td:first-child{padding-left:24px;width:36px}
td{padding:10px 16px;border-bottom:1px solid #1a1a1a;vertical-align:middle}
tr:hover td{background:var(--panel)}
tr.sel td{background:#1c2a3a}

input[type=checkbox]{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1.5px solid var(--dim);border-radius:3px;cursor:pointer;background:transparent;display:grid;place-content:center;flex-shrink:0}
input[type=checkbox]:checked{background:var(--blue);border-color:var(--blue)}
input[type=checkbox]:checked::after{content:'';width:5px;height:9px;border:solid #000;border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:-2px}

.fn{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.muted{color:var(--mute);font-size:13px}
.dim{color:var(--dim);font-size:13px}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.badge::before{content:'';width:8px;height:8px;border-radius:50%}
.badge.queued::before{background:var(--blue)}
.badge.processing::before{background:var(--yellow);animation:pulse 1s infinite}
.badge.done::before{background:var(--green)}
.badge.failed::before{background:var(--red)}
.badge.duplicate::before{background:var(--purple)}
.badge.unsupported::before{background:var(--dim)}
.badge.deleted::before{background:#444}
.badge.queued{color:var(--blue)}
.badge.processing{color:var(--yellow)}
.badge.done{color:var(--green)}
.badge.failed{color:var(--red)}
.badge.duplicate{color:var(--purple)}
.badge.unsupported,.badge.deleted{color:var(--dim)}

.actions{display:flex;gap:6px;justify-content:flex-end}

#empty{padding:80px;text-align:center;color:var(--dim)}
</style>
</head>
<body>

<aside>
  <form method="post" action="/logout" style="margin:0">
    <button class="logout-btn" title="Sign out" type="submit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </form>
  <div class="nav" id="nav">
    <button data-f="" class="on"><span class="dot all"></span>All<span class="count" id="c-total">0</span></button>
    <button data-f="queued"><span class="dot queued"></span>Queued<span class="count" id="c-queued">0</span></button>
    <button data-f="processing"><span class="dot processing"></span>Processing<span class="count" id="c-processing">0</span></button>
    <button data-f="done"><span class="dot done"></span>Done<span class="count" id="c-done">0</span></button>
    <button data-f="failed"><span class="dot failed"></span>Failed<span class="count" id="c-failed">0</span></button>
    <button data-f="duplicate"><span class="dot duplicate"></span>Duplicates<span class="count" id="c-duplicates">0</span></button>
    <button data-f="unsupported"><span class="dot unsupported"></span>Unsupported<span class="count" id="c-unsupported">0</span></button>
  </div>
  <div class="spacer"></div>
  <div class="log">
    <div class="log-head" id="log-head">
      <span>activity</span>
      <span class="clr" id="log-clear">clear</span>
    </div>
    <div class="log-body" id="log-body"></div>
  </div>
</aside>

<main>
  <header>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" placeholder="Search files…">
    </div>
    <div class="bulk" id="bulk">
      <span class="n"><span id="sel-n">0</span> selected</span>
      <button class="btn r" id="b-retry">Retry</button>
      <button class="btn d" id="b-del">Remove</button>
      <button class="btn" id="b-clear">Clear</button>
    </div>
  </header>

  <div class="rates">
    <div class="rate in">
      <span class="arrow">↓</span>
      <span class="v" id="r-in">0.0</span><span class="u">/s</span>
      <span class="l">ingest</span>
      <span class="spark" id="spark-in"></span>
    </div>
    <div class="rate out">
      <span class="arrow">↑</span>
      <span class="v" id="r-out">0.0</span><span class="u">/s</span>
      <span class="l">complete</span>
      <span class="spark" id="spark-out"></span>
    </div>
    <div class="rate act">
      <span class="v" id="r-act">0</span>
      <span class="l">active</span>
    </div>
    <div class="rate tput">
      last min · <b id="r-min-in">0</b> in · <b id="r-min-out">0</b> done
    </div>
  </div>

  <div class="scroll">
    <table>
      <thead>
        <tr>
          <th><input type="checkbox" id="all-cb"></th>
          <th>Filename</th>
          <th>Status</th>
          <th>Chunks</th>
          <th>Size</th>
          <th>Date</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" style="display:none">No files</div>
  </div>
</main>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sz=b=>!b?'—':b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB';
const dt=s=>{if(!s)return'—';const d=new Date(s),now=new Date();const sd=d.toDateString()===now.toDateString();return sd?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString([],{month:'short',day:'numeric'})+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};

let F='', S='', selected=new Set(), files=[];

function renderBulk(){
  const n=selected.size;
  $('sel-n').textContent=n;
  $('bulk').classList.toggle('show', n>0);
  document.querySelectorAll('tr[data-id]').forEach(tr=>tr.classList.toggle('sel', selected.has(tr.dataset.id)));
  const visible=files.map(f=>f.id);
  const allSel=visible.length>0 && visible.every(id=>selected.has(id));
  $('all-cb').checked=allSel;
  $('all-cb').indeterminate=!allSel && visible.some(id=>selected.has(id));
}

function rowActions(f){
  const a=[];
  if(f.status==='failed') a.push(`<button class="btn s r" onclick="rt('${f.id}')">Retry</button>`);
  if(['done','processing','failed','duplicate','unsupported'].includes(f.status))
    a.push(`<button class="btn s d" onclick="delAsk('${f.id}','${f.status}')">Delete</button>`);
  return a.join('');
}

async function load(){
  try{
    const [s,fs]=await Promise.all([
      fetch('/status').then(r=>r.json()),
      fetch('/files?'+(F?`status=${F}&`:'')+(S?`search=${encodeURIComponent(S)}`:'')).then(r=>r.json())
    ]);
    $('c-total').textContent=s.total;
    $('c-queued').textContent=s.queued;
    $('c-processing').textContent=s.processing;
    $('c-done').textContent=s.done;
    $('c-failed').textContent=s.failed;
    $('c-duplicates').textContent=s.duplicates;
    $('c-unsupported').textContent=s.unsupported;
    files=fs;
    $('empty').style.display=fs.length?'none':'block';
    $('rows').innerHTML=fs.map(f=>`
      <tr data-id="${f.id}" class="${selected.has(f.id)?'sel':''}">
        <td><input type="checkbox" ${selected.has(f.id)?'checked':''} onchange="tog('${f.id}',this.checked)"></td>
        <td><div class="fn" title="${esc(f.filename)}">${esc(f.filename)}</div></td>
        <td><span class="badge ${f.status}">${f.status}</span></td>
        <td class="muted">${f.qdrant_chunk_count??'—'}</td>
        <td class="muted">${sz(f.file_size_bytes)}</td>
        <td class="dim">${dt(f.ingested_at||f.created_at)}</td>
        <td><div class="actions">${rowActions(f)}</div></td>
      </tr>`).join('');
    renderBulk();
  }catch(e){console.error('load failed',e);}
}

function tog(id,on){on?selected.add(id):selected.delete(id);renderBulk();}

$('all-cb').onchange=e=>{
  if(e.target.checked) files.forEach(f=>selected.add(f.id));
  else files.forEach(f=>selected.delete(f.id));
  renderBulk();
};

$('b-clear').onclick=()=>{selected.clear();renderBulk();};
$('b-retry').onclick=async()=>{
  if(!confirm(`Retry ${selected.size} file(s)?`))return;
  await fetch('/files/bulk/retry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:[...selected]})});
  selected.clear(); load();
};
$('b-del').onclick=async()=>{
  const phys=confirm(`Remove ${selected.size} file(s) — also delete physical file? (Cancel = keep file)`);
  await fetch('/files/bulk/delete?delete_physical='+(phys?'true':'false'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:[...selected]})});
  selected.clear(); load();
};

async function del(id,phys){
  await fetch(`/files/${id}?delete_physical=${phys?'true':'false'}`,{method:'DELETE'});
  load();
}
async function delAsk(id,status){
  // done/processing keep file; everything else has no value to keep
  if(status==='done'||status==='processing'){
    const phys=confirm('Delete this file?\n\nOK = remove from knowledge base AND delete physical file\nCancel = remove from knowledge base only (keep file in /done)');
    return del(id, phys);
  }
  if(!confirm('Delete this file permanently?')) return;
  return del(id, true);
}
async function rt(id){await fetch(`/files/${id}/retry`,{method:'POST'});load();}

document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); F=b.dataset.f; selected.clear(); load();
});

let t;
$('q').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{S=e.target.value;load()},250)};

load(); setInterval(load,2500);

// ── live rates from event stream ──
const inEvents=[], outEvents=[];
const SPARK_BUCKETS=20, SPARK_WINDOW_MS=60_000;

function buildSpark(id){
  const el=$(id);
  for(let i=0;i<SPARK_BUCKETS;i++){const b=document.createElement('span');b.style.height='2px';el.appendChild(b)}
}
buildSpark('spark-in'); buildSpark('spark-out');

function trackEvent(msg){
  const now=Date.now();
  if(/^Queued:/.test(msg)) inEvents.push(now);
  else if(/^Done:/.test(msg)) outEvents.push(now);
  // failed counts as completion too
  else if(/^Failed:/.test(msg)) outEvents.push(now);
}

function trim(arr){
  const cutoff=Date.now()-SPARK_WINDOW_MS;
  while(arr.length && arr[0]<cutoff) arr.shift();
}

function paintSpark(id,arr){
  trim(arr);
  const el=$(id), now=Date.now();
  const bucketSize=SPARK_WINDOW_MS/SPARK_BUCKETS;
  const counts=new Array(SPARK_BUCKETS).fill(0);
  arr.forEach(t=>{
    const idx=Math.min(SPARK_BUCKETS-1, Math.floor((t-(now-SPARK_WINDOW_MS))/bucketSize));
    counts[idx]++;
  });
  const max=Math.max(2,...counts);
  el.querySelectorAll('span').forEach((s,i)=>{
    const h=Math.max(2, Math.round((counts[i]/max)*16));
    s.style.height=h+'px';
    s.classList.toggle('hot', counts[i]>0);
  });
}

function updateRates(){
  trim(inEvents); trim(outEvents);
  const inRate=(inEvents.length/(SPARK_WINDOW_MS/1000)).toFixed(1);
  const outRate=(outEvents.length/(SPARK_WINDOW_MS/1000)).toFixed(1);
  $('r-in').textContent=inRate;
  $('r-out').textContent=outRate;
  $('r-min-in').textContent=inEvents.length;
  $('r-min-out').textContent=outEvents.length;
  $('r-act').textContent=$('c-processing').textContent;
  paintSpark('spark-in', inEvents);
  paintSpark('spark-out', outEvents);
}
setInterval(updateRates, 1000);

// ── live event log via SSE ──
const logBody=$('log-body'), logHead=$('log-head');
const MAX_LINES=300;
let es=null;

function fmtTime(iso){
  const d=new Date(iso);
  return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function appendLog(evt){
  trackEvent(evt.msg||'');
  const atBottom=logBody.scrollHeight-logBody.scrollTop-logBody.clientHeight<20;
  const line=document.createElement('div');
  line.className='log-line '+(evt.lvl||'INFO');
  line.innerHTML=`<span class="ts">${fmtTime(evt.t)}</span><span class="lvl">${esc(evt.lvl||'INFO')}</span>${esc(evt.msg||'')}`;
  logBody.appendChild(line);
  while(logBody.children.length>MAX_LINES) logBody.removeChild(logBody.firstChild);
  if(atBottom) logBody.scrollTop=logBody.scrollHeight;
}
function connect(){
  if(es){try{es.close()}catch{}}
  es=new EventSource('/events');
  es.onopen=()=>logHead.classList.remove('off');
  es.onerror=()=>{logHead.classList.add('off');setTimeout(connect,3000)};
  es.onmessage=e=>{try{appendLog(JSON.parse(e.data))}catch{}};
}
connect();

$('log-clear').onclick=()=>{logBody.innerHTML=''};
</script>
</body>
</html>
