<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Data Ingestor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0f0f; --panel:#1f1f1f; --hover:#272727; --line:#303030;
  --text:#f1f1f1; --mute:#aaa; --dim:#717171;
  --blue:#3ea6ff; --green:#2ba640; --yellow:#ffd60a; --red:#f28b82; --purple:#c58af9;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;display:flex;overflow:hidden}

/* sidebar */
aside{width:260px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative}
.logout-btn{
  width:30px;height:30px;border-radius:50%;
  background:transparent;border:1px solid transparent;color:var(--dim);
  cursor:pointer;display:grid;place-items:center;flex-shrink:0;
  transition:all .15s;
}
.logout-btn:hover{background:var(--hover);color:var(--text);border-color:var(--line)}
.logout-btn svg{width:14px;height:14px}
.nav{display:flex;flex-direction:column;flex-shrink:0;padding-top:16px}
.nav button{
  background:none;border:0;color:var(--text);font:inherit;cursor:pointer;
  padding:9px 20px;text-align:left;display:flex;align-items:center;gap:10px;
  border-left:3px solid transparent;
}
.nav button:hover{background:var(--hover)}
.nav button.on{background:var(--hover);border-left-color:var(--blue);font-weight:500}
.nav .count{margin-left:auto;font-size:12px;color:var(--mute);background:var(--panel);padding:1px 8px;border-radius:10px;min-width:24px;text-align:center}
.nav .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.nav .dot.queued{background:var(--blue)}
.nav .dot.processing{background:var(--yellow)}
.nav .dot.done{background:var(--green)}
.nav .dot.failed{background:var(--red)}
.nav .dot.duplicate{background:var(--purple)}
.nav .dot.unsupported{background:var(--dim)}
.nav .dot.all{background:var(--text)}

.spacer{flex:1;min-height:8px}

/* cleanup section */
.cleanup{
  display:none;flex-direction:column;flex-shrink:0;
  border-top:1px solid var(--line);
}
.cleanup-head{
  padding:8px 20px;font-size:12px;color:var(--mute);font-weight:500;
  display:flex;align-items:center;gap:8px;
}
.cleanup-btn{
  background:none;border:0;cursor:pointer;font:inherit;
  padding:7px 20px;text-align:left;display:flex;align-items:center;gap:10px;
  color:var(--mute);font-size:13px;border-left:3px solid transparent;
  width:100%;
}
.cleanup-btn:hover{background:var(--hover);color:var(--red);border-left-color:var(--red)}
.cleanup-btn svg{width:14px;height:14px;flex-shrink:0;opacity:.5}
.cleanup-btn:hover svg{opacity:1}
.cleanup-btn .cc{margin-left:auto;font-size:12px;color:var(--dim);background:var(--panel);padding:1px 8px;border-radius:10px;min-width:24px;text-align:center}
.cleanup-btn.danger{color:var(--red);opacity:.7;border-top:1px solid var(--line);margin-top:2px}
.cleanup-btn.danger:hover{opacity:1}

/* live log */
.log{
  display:flex;flex-direction:column;min-height:0;
  border-top:1px solid var(--line);
}
.log-head{
  padding:8px 20px;font-size:12px;color:var(--mute);font-weight:500;
  display:flex;align-items:center;gap:8px;flex-shrink:0;
}
.log-head::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
.log-head.off::before{background:var(--dim);animation:none}
.log-head .clr{margin-left:auto;cursor:pointer;font-size:10px;color:var(--dim);text-transform:none;letter-spacing:0}
.log-head .clr:hover{color:var(--text)}
.log-body{
  height:220px;overflow-y:auto;padding:2px 0;
  scrollbar-width:thin;scrollbar-color:#333 transparent;
}
.log-body::-webkit-scrollbar{width:4px}
.log-body::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px}
.log-line{
  padding:4px 20px;display:flex;align-items:flex-start;gap:8px;
  animation:slide .12s ease-out;
  border-left:2px solid transparent;
}
.log-line:hover{background:var(--hover)}
.log-line .ldot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:5px}
.log-line .ts{font-size:11px;color:var(--dim);flex-shrink:0;padding-top:1px}
.log-line .msg{font-size:12px;color:var(--mute);word-break:break-word;min-width:0}
.log-line.INFO  .ldot{background:var(--blue)}
.log-line.INFO  .msg{color:var(--mute)}
.log-line.WARNING .ldot{background:var(--yellow)}
.log-line.WARNING .msg{color:var(--yellow)}
.log-line.WARNING{border-left-color:rgba(255,214,10,.2)}
.log-line.ERROR .ldot{background:var(--red)}
.log-line.ERROR .msg{color:var(--red)}
.log-line.ERROR{border-left-color:rgba(242,139,130,.2)}
.log-line.DEBUG .ldot{background:var(--dim)}
.log-line.DEBUG .msg{color:var(--dim)}
@keyframes slide{from{transform:translateX(-4px);opacity:0}}

@keyframes pulse{50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:translateY(-6px);opacity:0}}

/* main */
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:14px 24px;border-bottom:1px solid var(--line)}

/* live rate strip */
.rates{display:flex;gap:24px;padding:10px 24px;border-bottom:1px solid var(--line);background:#161616;align-items:center}
.rate{display:flex;align-items:baseline;gap:6px}
.rate .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text);min-width:34px}
.rate .u{font-size:11px;color:var(--dim)}
.rate .l{font-size:12px;color:var(--mute);margin-left:4px}
.rate .arrow{font-size:14px;margin-right:2px}
.rate.in .arrow{color:var(--blue)}
.rate.out .arrow{color:var(--green)}
.rate.act .v{color:var(--yellow)}
.rate.eta .v{color:var(--purple);font-variant-numeric:tabular-nums}
.rate.tput{margin-left:auto;color:var(--dim);font-size:12px}
.rate.tput b{color:var(--mute);font-weight:500}
.spark{display:flex;align-items:flex-end;gap:1px;height:18px;margin-left:6px}
.spark span{width:3px;background:var(--line);border-radius:1px;transition:height .3s}
.rate.in .spark span.hot{background:var(--blue)}
.rate.out .spark span.hot{background:var(--green)}
.search{flex:1;max-width:480px;position:relative}
.search input{
  width:100%;background:var(--panel);border:1px solid transparent;border-radius:20px;
  padding:8px 14px 8px 38px;color:var(--text);font:inherit;
}
.search input:focus{outline:0;background:var(--bg);border-color:var(--line)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:.6}
.bulk{display:none;align-items:center;gap:8px;animation:pop .15s ease-out}
.bulk.show{display:flex}
.bulk .n{color:var(--mute);font-size:13px;margin-right:4px}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:6px 14px;border-radius:18px;cursor:pointer;font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn.r{color:var(--green);border-color:#2a4a32}
.btn.r:hover{background:#1a2a20}
.btn.d{color:var(--red);border-color:#4a2a2a}
.btn.d:hover{background:#2a1a1a}
.btn.s{padding:5px 14px;font-size:12px}

/* table */
.scroll{flex:1;overflow:auto}
table{width:100%;border-collapse:collapse}
thead{position:sticky;top:0;background:var(--bg);z-index:1}
th{text-align:left;padding:10px 16px;font-size:12px;font-weight:500;color:var(--mute);border-bottom:1px solid var(--line)}
th:first-child,td:first-child{padding-left:24px;width:36px}
td{padding:10px 16px;border-bottom:1px solid #1a1a1a;vertical-align:middle}
tr:hover td{background:var(--panel)}
tr.sel td,#rows.all-sel tr td{background:#1c2a3a}

input[type=checkbox]{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1.5px solid var(--dim);border-radius:3px;cursor:pointer;background:transparent;display:grid;place-content:center;flex-shrink:0}
input[type=checkbox]:checked{background:var(--blue);border-color:var(--blue)}
input[type=checkbox]:checked::after{content:'';width:5px;height:9px;border:solid #000;border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:-2px}

.fn{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.muted{color:var(--mute);font-size:13px}
.dim{color:var(--dim);font-size:13px}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.badge::before{content:'';width:8px;height:8px;border-radius:50%}
.badge.queued::before{background:var(--blue)}
.badge.processing::before{background:var(--yellow);animation:pulse 1s infinite}
.badge.done::before{background:var(--green)}
.badge.failed::before{background:var(--red)}
.badge.duplicate::before{background:var(--purple)}
.badge.unsupported::before{background:var(--dim)}
.badge.deleted::before{background:#444}
.badge.queued{color:var(--blue)}
.badge.processing{color:var(--yellow)}
.badge.done{color:var(--green)}
.badge.failed{color:var(--red)}
.badge.duplicate{color:var(--purple)}
.badge.unsupported,.badge.deleted{color:var(--dim)}

.actions{display:flex;gap:6px;justify-content:flex-end}

#empty{padding:80px;text-align:center;color:var(--dim)}

/* progress toast */
#toast{
  position:fixed;bottom:24px;right:24px;z-index:200;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:14px 18px;min-width:220px;max-width:300px;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
  display:none;flex-direction:column;gap:8px;
  animation:pop .2s ease-out;
}
#toast.show{display:flex}
.toast-title{font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;color:var(--text)}
.toast-title svg{width:14px;height:14px;flex-shrink:0}
.toast-bar-wrap{background:var(--line);border-radius:3px;height:3px}
.toast-bar{height:100%;border-radius:3px;transition:width .15s,background .3s;width:0%}
.toast-sub{font-size:11px;color:var(--dim)}

/* modal */
#modal-overlay{
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.65);backdrop-filter:blur(2px);
  display:none;align-items:center;justify-content:center;
}
#modal-overlay.show{display:flex}
#modal-box{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:24px 28px;min-width:320px;max-width:440px;width:90%;
  box-shadow:0 16px 48px rgba(0,0,0,.6);
  animation:pop .15s ease-out;display:flex;flex-direction:column;gap:14px;
}
.modal-title{font-size:15px;font-weight:600;color:var(--text)}
.modal-msg{font-size:13px;color:var(--mute);line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:50vh;overflow-y:auto}
.modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.modal-cancel{background:none;border:1px solid var(--line);color:var(--mute);padding:7px 18px;border-radius:18px;cursor:pointer;font:inherit;font-size:13px}
.modal-cancel:hover{background:var(--hover);color:var(--text)}
.modal-confirm{background:#3a1a1a;border:1px solid #6a2a2a;color:var(--red);padding:7px 18px;border-radius:18px;cursor:pointer;font:inherit;font-size:13px;font-weight:500}
.modal-confirm:hover{background:#4a2020}
</style>
</head>
<body>

<aside>
  <div class="nav" id="nav">
    <button data-f="" class="on"><span class="dot all"></span>All<span class="count" id="c-total">0</span></button>
    <button data-f="queued"><span class="dot queued"></span>Queued<span class="count" id="c-queued">0</span></button>
    <button data-f="processing"><span class="dot processing"></span>Processing<span class="count" id="c-processing">0</span></button>
    <button data-f="done"><span class="dot done"></span>Done<span class="count" id="c-done">0</span></button>
    <button data-f="failed"><span class="dot failed"></span>Failed<span class="count" id="c-failed">0</span></button>
    <button data-f="duplicate"><span class="dot duplicate"></span>Duplicates<span class="count" id="c-duplicates">0</span></button>
    <button data-f="unsupported"><span class="dot unsupported"></span>Unsupported<span class="count" id="c-unsupported">0</span></button>
  </div>
  <div class="spacer"></div>
  <div class="cleanup" id="cleanup">
    <div class="cleanup-head">Cleanup</div>
    <button class="cleanup-btn" id="purge-failed" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      Delete all failed<span class="cc" id="cc-failed">0</span>
    </button>
    <button class="cleanup-btn" id="purge-dup" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      Delete all duplicates<span class="cc" id="cc-dup">0</span>
    </button>
    <button class="cleanup-btn" id="purge-uns" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      Delete all unsupported<span class="cc" id="cc-uns">0</span>
    </button>
  </div>
  <div class="log">
    <div class="log-head" id="log-head">
      <span>Activity</span>
      <span class="clr" id="log-clear">Clear</span>
    </div>
    <div class="log-body" id="log-body"></div>
  </div>
</aside>

<main>
  <header>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" placeholder="Search files…">
    </div>
    <span id="search-hint" style="font-size:11px;color:var(--dim);white-space:nowrap;display:none"></span>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
      <div class="bulk" id="bulk">
        <span class="n"><span id="sel-n">0</span> selected</span>
        <button class="btn r" id="b-retry">Retry</button>
        <button class="btn d" id="b-del">Delete</button>
      </div>
      <form method="post" action="/logout" style="margin:0">
        <button class="logout-btn" title="Sign out" type="submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </form>
    </div>
  </header>

  <div class="rates">
    <div class="rate in">
      <span class="arrow">↓</span>
      <span class="v" id="r-in">0.0</span><span class="u">/s</span>
      <span class="l">Uploads</span>
      <span class="spark" id="spark-in"></span>
    </div>
    <div class="rate out">
      <span class="arrow">↑</span>
      <span class="v" id="r-out">0.0</span><span class="u">/s</span>
      <span class="l">Processed</span>
      <span class="spark" id="spark-out"></span>
    </div>
    <div class="rate eta">
      <span class="v" id="r-eta">—</span>
      <span class="l">ETA</span>
    </div>
    <div class="rate tput">
      Last min · <b id="r-min-in">0</b> up · <b id="r-min-out">0</b> done
    </div>
  </div>

  <div class="scroll">
    <table>
      <thead>
        <tr>
          <th><input type="checkbox" id="all-cb"></th>
          <th>Filename</th>
          <th>Status</th>
          <th>Chunks</th>
          <th>Size</th>
          <th>Date</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" style="display:none">No files</div>
    <div id="sentinel" style="height:1px"></div>
  </div>
</main>

<div id="modal-overlay">
  <div id="modal-box">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-msg" id="modal-msg"></div>
    <div class="modal-btns">
      <button class="modal-cancel" id="modal-cancel">Cancel</button>
      <button class="modal-confirm" id="modal-confirm">Delete</button>
    </div>
  </div>
</div>

<div id="toast">
  <div class="toast-title">
    <svg id="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
    <span id="toast-title">Deleting…</span>
  </div>
  <div class="toast-bar-wrap"><div class="toast-bar" id="toast-bar"></div></div>
  <div class="toast-sub" id="toast-sub"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sz=b=>!b?'—':b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB';
const dt=s=>{if(!s)return'—';const d=new Date(s),now=new Date();const sd=d.toDateString()===now.toDateString();return sd?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString([],{month:'short',day:'numeric'})+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};

let F='',S='',selected=new Set(),files=[];
let pageOffset=0,hasMore=true,loadingMore=false;
const PAGE=200;
let reloadDebounce=null;

// ── Modal (replaces browser confirm()) ───────────────────────────────────
let _modalResolve=null;
function showModal(title,msg,confirmLabel='Delete',danger=true){
  return new Promise(resolve=>{
    _modalResolve=resolve;
    $('modal-title').textContent=title;
    $('modal-msg').textContent=msg;
    $('modal-confirm').textContent=confirmLabel;
    const c=$('modal-confirm');
    // "Close" = info-only popup, no destructive intent → muted style + hide Cancel
    const isInfo=confirmLabel==='Close';
    $('modal-cancel').style.display=isInfo?'none':'';
    if(isInfo){c.style.background='var(--panel)';c.style.borderColor='var(--line)';c.style.color='var(--text)';}
    else if(danger){c.style.background='#3a1a1a';c.style.borderColor='#6a2a2a';c.style.color='var(--red)';}
    else{c.style.background='#1a3a1a';c.style.borderColor='#2a6a2a';c.style.color='var(--green)';}
    $('modal-overlay').classList.add('show');
    $('modal-confirm').focus();
  });
}
$('modal-confirm').onclick=()=>{$('modal-overlay').classList.remove('show');if(_modalResolve){_modalResolve(true);_modalResolve=null;}};
$('modal-cancel').onclick=()=>{$('modal-overlay').classList.remove('show');if(_modalResolve){_modalResolve(false);_modalResolve=null;}};
$('modal-overlay').onclick=e=>{if(e.target===$('modal-overlay')){$('modal-overlay').classList.remove('show');if(_modalResolve){_modalResolve(false);_modalResolve=null;}}};
document.addEventListener('keydown',e=>{
  if(!$('modal-overlay').classList.contains('show'))return;
  if(e.key==='Escape'){$('modal-overlay').classList.remove('show');if(_modalResolve){_modalResolve(false);_modalResolve=null;}}
  else if(e.key==='Enter'){$('modal-overlay').classList.remove('show');if(_modalResolve){_modalResolve(true);_modalResolve=null;}}
});

// ── Render bulk bar ───────────────────────────────────────────────────────
function renderBulk(){
  const n=selected.size;
  $('sel-n').textContent=n;
  $('bulk').classList.toggle('show',n>0);
  const tbody=$('rows');
  const allVis=files.length>0&&files.every(f=>selected.has(f.id));
  if(allVis){
    // O(1): one CSS class covers all rows instantly
    tbody.classList.add('all-sel');
  } else {
    tbody.classList.remove('all-sel');
    // Only touch rows whose state actually changed
    tbody.querySelectorAll('tr[data-id]').forEach(tr=>{
      const want=selected.has(tr.dataset.id);
      if(tr.classList.contains('sel')!==want) tr.classList.toggle('sel',want);
    });
  }
  $('all-cb').checked=allVis&&n>0;
  $('all-cb').indeterminate=n>0&&!allVis;
  const selFiles=files.filter(f=>selected.has(f.id));
  const allRetryable=selFiles.length>0&&selFiles.every(f=>f.status==='failed');
  $('b-retry').style.display=allRetryable?'':'none';
}

// ── Row builder ───────────────────────────────────────────────────────────
function rowActions(f){
  const a=[];
  if(f.status==='failed') a.push(`<button class="btn s" onclick="showErr('${f.id}')" title="Why did this fail?">Why?</button>`);
  if(f.status==='failed') a.push(`<button class="btn s r" onclick="rt('${f.id}')">Retry</button>`);
  if(f.status!=='deleted') a.push(`<button class="btn s d" onclick="del('${f.id}')">Delete</button>`);
  return a.join('');
}
async function showErr(id){
  try{
    const r=await fetch(`/files/${id}/error`).then(r=>r.json());
    const msg=(r.error||'(no error message saved)').slice(0,4000);
    await showModal('Failed: '+r.filename, msg, 'Close', false);
  }catch(e){toastError('Could not load error');}
}
function makeRow(f){
  const tr=document.createElement('tr');
  tr.dataset.id=f.id;
  if(selected.has(f.id)) tr.classList.add('sel');
  tr.innerHTML=
    `<td><input type="checkbox"${selected.has(f.id)?' checked':''} onchange="tog('${f.id}',this.checked)"></td>`+
    `<td><div class="fn" title="${esc(f.filename)}">${esc(f.filename)}</div></td>`+
    `<td><span class="badge ${f.status}">${f.status}</span></td>`+
    `<td class="muted">${f.qdrant_chunk_count??'—'}</td>`+
    `<td class="muted">${sz(f.file_size_bytes)}</td>`+
    `<td class="dim">${dt(f.ingested_at||f.created_at)}</td>`+
    `<td><div class="actions">${rowActions(f)}</div></td>`;
  return tr;
}

// ── Counts + purge button visibility ─────────────────────────────────────
function updateCounts(s){
  $('c-total').textContent=s.total;
  $('c-queued').textContent=s.queued;
  $('c-processing').textContent=s.processing;
  $('c-done').textContent=s.done;
  $('c-failed').textContent=s.failed;
  $('c-duplicates').textContent=s.duplicates;
  $('c-unsupported').textContent=s.unsupported;

  // Cleanup section — show only when something needs cleaning
  const errors=s.failed+s.duplicates+s.unsupported;
  $('cleanup').style.display=errors>0?'flex':'none';
  function cbtn(id,ccid,n){$('cc-'+ccid).textContent=n;$('purge-'+id).style.display=n>0?'flex':'none';}
  cbtn('failed','failed',s.failed);
  cbtn('dup',   'dup',   s.duplicates);
  cbtn('uns',   'uns',   s.unsupported);
}

// ── Load first page + reset ───────────────────────────────────────────────
function fileQS(offset){
  return '/files?'+(F?`status=${encodeURIComponent(F)}&`:'')+(S?`search=${encodeURIComponent(S)}&`:'')+`offset=${offset}&limit=${PAGE}`;
}
function idsQS(status){
  return '/files/ids?'+(status?`status=${encodeURIComponent(status)}&`:'')+(S?`search=${encodeURIComponent(S)}`:'' );
}

async function load(preserveSel=false){
  pageOffset=0; hasMore=true; files=[];
  if(!preserveSel){ selected.clear(); $('rows').classList.remove('all-sel'); }
  $('rows').innerHTML='';
  try{
    const [s,batch]=await Promise.all([
      fetch('/status').then(r=>r.json()),
      fetch(fileQS(0)).then(r=>r.json())
    ]);
    updateCounts(s);
    appendBatch(batch);
    if(batch.length<PAGE) hasMore=false;
    $('empty').style.display=files.length?'none':'block';
    // Search/filter hint
    const hint=$('search-hint');
    if(S||F){
      const n=files.length;
      const plus=hasMore?'+':'';
      hint.textContent=S?`${n}${plus} match${n===1&&!plus?'':'es'}`:n+plus+' files';
      hint.style.display='';
    } else {
      hint.style.display='none';
    }
  }catch(e){console.error('load',e);}
}

function appendBatch(batch){
  files=[...files,...batch];
  pageOffset+=batch.length;
  const frag=document.createDocumentFragment();
  batch.forEach(f=>frag.appendChild(makeRow(f)));
  $('rows').appendChild(frag);
  renderBulk();
  // Keep hint count in sync as more pages load
  const hint=$('search-hint');
  if(hint.style.display!=='none'&&hint.textContent){
    const n=files.length,plus=hasMore?'+':'';
    hint.textContent=S?`${n}${plus} match${n===1&&!plus?'':'es'}`:n+plus+' files';
  }
}

async function loadMore(){
  if(loadingMore||!hasMore) return;
  loadingMore=true;
  try{
    const batch=await fetch(fileQS(pageOffset)).then(r=>r.json());
    appendBatch(batch);
    if(batch.length<PAGE) hasMore=false;
  }catch(e){console.error('loadMore',e);}
  finally{loadingMore=false;}
}

// IntersectionObserver — fires when sentinel div near viewport
new IntersectionObserver(e=>{if(e[0].isIntersecting)loadMore();},{rootMargin:'400px'})
  .observe($('sentinel'));

// Status counts auto-refresh (no list reset, preserves scroll)
async function refreshCounts(){
  try{updateCounts(await fetch('/status').then(r=>r.json()));}catch{}
}
setInterval(refreshCounts,3000);

// ── Selection ─────────────────────────────────────────────────────────────
function tog(id,on){on?selected.add(id):selected.delete(id);renderBulk();}

$('all-cb').onchange=async e=>{
  if(e.target.checked){
    files.forEach(f=>selected.add(f.id));  // instant visual via all-sel CSS
    renderBulk();
    if(hasMore){
      // Fetch all matching IDs in background so bulk acts on truly all files
      try{
        const ids=await fetch(idsQS(F)).then(r=>r.json());
        ids.forEach(id=>selected.add(id));
        $('sel-n').textContent=selected.size;
      }catch(e){console.error('ids',e);}
    }
  } else {
    selected.clear();
    $('rows').classList.remove('all-sel');
    renderBulk();
  }
};

// ── Toast progress ────────────────────────────────────────────────────────
let toastTimer=null;
let _deleteStart=0;
function toastProgress(title,done,total){
  clearTimeout(toastTimer);
  const pct=total>0?Math.round(done/total*100):0;
  $('toast-title').textContent=title;
  $('toast-bar').style.width=pct+'%';
  $('toast-bar').style.background='var(--blue)';
  let sub=total>1?`${done} / ${total} files`:'';
  if(done>0&&total>1){
    const elapsed=(Date.now()-_deleteStart)/1000;
    const rate=done/elapsed;
    const remaining=total-done;
    if(rate>0&&remaining>0){
      const eta=Math.ceil(remaining/rate);
      sub+=` · ~${eta}s left`;
    }
  }
  $('toast-sub').textContent=sub;
  $('toast').classList.add('show');
}
function toastDone(msg,n){
  $('toast-title').textContent=msg+(n?' ('+n+')':'');
  $('toast-bar').style.width='100%';
  $('toast-bar').style.background='var(--green)';
  $('toast-sub').textContent='';
  toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2500);
}
function toastError(msg){
  $('toast-title').textContent=msg;
  $('toast-bar').style.width='100%';
  $('toast-bar').style.background='var(--red)';
  $('toast-sub').textContent='';
  toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3000);
}

// Batch-deletes ids with live progress updates, returns count deleted
async function deleteWithProgress(ids){
  const total=ids.length;
  const BATCH=50;
  let done=0;
  _deleteStart=Date.now();
  toastProgress('Deleting…',0,total);
  try{
    for(let i=0;i<ids.length;i+=BATCH){
      const batch=ids.slice(i,i+BATCH);
      const res=await fetch('/files/bulk/delete?delete_physical=true',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ids:batch})
      }).then(r=>r.json());
      done+=res.deleted??batch.length;
      toastProgress('Deleting…',done,total);
    }
    toastDone('Deleted',done);
  }catch(e){
    toastError('Delete failed');
    console.error(e);
  }
  return done;
}

// ── Bulk actions ──────────────────────────────────────────────────────────
$('b-retry').onclick=async()=>{
  if(!await showModal('Retry files',`Retry ${selected.size} file(s)?`,'Retry',false))return;
  await fetch('/files/bulk/retry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:[...selected]})});
  selected.clear();load();
};
$('b-del').onclick=async()=>{
  const ids=[...selected];
  if(!await showModal('Delete files',`Delete ${ids.length} file(s)?\nPermanently removed from knowledge base, database and disk.`))return;
  selected.clear();
  await deleteWithProgress(ids);
  load();
};

async function del(id){
  if(!await showModal('Delete file','Permanently removed from knowledge base, database and disk.'))return;
  _deleteStart=Date.now();
  toastProgress('Deleting…',0,1);
  try{
    await fetch(`/files/${id}?delete_physical=true`,{method:'DELETE'});
    toastDone('File deleted');
  }catch(e){toastError('Delete failed');}
  load();
}
async function rt(id){await fetch(`/files/${id}/retry`,{method:'POST'});load();}

// ── Purge helpers ─────────────────────────────────────────────────────────
async function purgeByStatus(status,countId,label){
  const n=parseInt($(countId).textContent)||0;
  if(!n)return;
  if(!await showModal(`Delete all ${label}`,`${n} files will be permanently removed from disk, database and knowledge base.`))return;
  const ids=await fetch(idsQS(status)).then(r=>r.json());
  if(!ids.length)return;
  await deleteWithProgress(ids);
  load();
}

$('purge-failed').onclick=()=>purgeByStatus('failed',    'c-failed',     'failed files');
$('purge-dup').onclick=   ()=>purgeByStatus('duplicate', 'c-duplicates', 'duplicates');
$('purge-uns').onclick=   ()=>purgeByStatus('unsupported','c-unsupported','unsupported files');

// ── Nav filter ────────────────────────────────────────────────────────────
document.querySelectorAll('#nav button[data-f]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#nav button[data-f]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); F=b.dataset.f; selected.clear(); load();
});

let t;
$('q').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{S=e.target.value;load()},250)};

// ── Live rates ────────────────────────────────────────────────────────────
const inEvents=[],outEvents=[];
const SPARK_BUCKETS=20,SPARK_WINDOW_MS=60_000;
function buildSpark(id){const el=$(id);for(let i=0;i<SPARK_BUCKETS;i++){const b=document.createElement('span');b.style.height='2px';el.appendChild(b)}}
buildSpark('spark-in');buildSpark('spark-out');
function trackEvent(msg){
  const now=Date.now();
  if(/^Queued:/.test(msg)) inEvents.push(now);
  else if(/^Done:/.test(msg)||/^Failed:/.test(msg)) outEvents.push(now);
}
function trimArr(a){const c=Date.now()-SPARK_WINDOW_MS;while(a.length&&a[0]<c)a.shift();}
function paintSpark(id,arr){
  trimArr(arr);const el=$(id),now=Date.now(),bs=SPARK_WINDOW_MS/SPARK_BUCKETS;
  const counts=new Array(SPARK_BUCKETS).fill(0);
  arr.forEach(t=>{counts[Math.min(SPARK_BUCKETS-1,Math.floor((t-(now-SPARK_WINDOW_MS))/bs))]++;});
  const max=Math.max(2,...counts);
  el.querySelectorAll('span').forEach((s,i)=>{s.style.height=Math.max(2,Math.round((counts[i]/max)*16))+'px';s.classList.toggle('hot',counts[i]>0);});
}
function fmtETA(sec){
  if(!isFinite(sec)||sec<=0)return '—';
  if(sec<60)return Math.round(sec)+'s';
  if(sec<3600){const m=Math.floor(sec/60),s=Math.round(sec%60);return m+'m'+(s?' '+s+'s':'');}
  const h=Math.floor(sec/3600),m=Math.round((sec%3600)/60);
  return h+'h'+(m?' '+m+'m':'');
}
function updateRates(){
  trimArr(inEvents);trimArr(outEvents);
  const rIn=inEvents.length/(SPARK_WINDOW_MS/1000);
  const rOut=outEvents.length/(SPARK_WINDOW_MS/1000);
  $('r-in').textContent=rIn.toFixed(1);
  $('r-out').textContent=rOut.toFixed(1);
  $('r-min-in').textContent=inEvents.length;
  $('r-min-out').textContent=outEvents.length;
  // ETA = (queued + processing) / completion-rate
  const remaining=(parseInt($('c-queued').textContent)||0)+(parseInt($('c-processing').textContent)||0);
  $('r-eta').textContent=remaining>0&&rOut>0.05?fmtETA(remaining/rOut):(remaining>0?'…':'—');
  paintSpark('spark-in',inEvents);paintSpark('spark-out',outEvents);
}
setInterval(updateRates,1000);

// ── Live log via SSE ──────────────────────────────────────────────────────
const logBody=$('log-body'),logHead=$('log-head');
const MAX_LINES=300;
let es=null;
function fmtTime(iso){return new Date(iso).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
let lastReload=0;
function scheduleReload(){
  // Throttle to one reload every ~1.5s — under heavy event flux a debounced
  // reload never fires because new events keep resetting it, causing the
  // sidebar counts (e.g. Processing) to drift from the visible rows.
  const now=Date.now();
  if(now-lastReload>1500){
    lastReload=now;
    load(true);
  } else if(!reloadDebounce){
    reloadDebounce=setTimeout(()=>{reloadDebounce=null;lastReload=Date.now();load(true);},1500-(now-lastReload));
  }
}
function appendLog(evt){
  trackEvent(evt.msg||'');
  if(/^(Queued|Done|Failed|Duplicate|Unsupported|Processing):/.test(evt.msg||'')){
    scheduleReload();
  }
  const atBottom=logBody.scrollHeight-logBody.scrollTop-logBody.clientHeight<20;
  const line=document.createElement('div');
  line.className='log-line '+(evt.lvl||'INFO');
  line.innerHTML=`<span class="ldot"></span><span class="ts">${fmtTime(evt.t)}</span><span class="msg">${esc(evt.msg||'')}</span>`;
  logBody.appendChild(line);
  while(logBody.children.length>MAX_LINES)logBody.removeChild(logBody.firstChild);
  if(atBottom)logBody.scrollTop=logBody.scrollHeight;
}
function connect(){
  if(es){try{es.close()}catch{}}
  es=new EventSource('/events');
  es.onopen=()=>logHead.classList.remove('off');
  es.onerror=()=>{logHead.classList.add('off');setTimeout(connect,3000)};
  es.onmessage=e=>{try{appendLog(JSON.parse(e.data))}catch{}};
}
connect();
$('log-clear').onclick=async()=>{
  logBody.innerHTML='';
  // Drain server-side ring buffer so refresh doesn't bring lines back
  try{await fetch('/events/clear',{method:'POST'});}catch{}
};

load();
</script>
