<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Data Ingestor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0f0f; --panel:#1f1f1f; --hover:#272727; --line:#303030;
  --text:#f1f1f1; --mute:#aaa; --dim:#717171;
  --blue:#3ea6ff; --green:#2ba640; --yellow:#ffd60a; --red:#f28b82; --purple:#c58af9;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;display:flex;overflow:hidden}

/* sidebar */
aside{width:260px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative}
.logout-btn{
  width:30px;height:30px;border-radius:50%;
  background:transparent;border:1px solid transparent;color:var(--dim);
  cursor:pointer;display:grid;place-items:center;flex-shrink:0;
  transition:all .15s;
}
.logout-btn:hover{background:var(--hover);color:var(--text);border-color:var(--line)}
.logout-btn svg{width:14px;height:14px}
.lang{position:relative;flex-shrink:0}
.lang-btn{
  display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:15px;
  background:transparent;border:1px solid var(--line);color:var(--mute);
  cursor:pointer;font:500 12px Inter,system-ui,sans-serif;transition:all .15s;
}
.lang-btn:hover{background:var(--hover);color:var(--text)}
.lang-btn .globe{width:14px;height:14px;opacity:.85;flex-shrink:0}
.lang-btn .chev{width:12px;height:12px;opacity:.6;transition:transform .15s;flex-shrink:0}
.lang.open .lang-btn{border-color:var(--blue);color:var(--text)}
.lang.open .lang-btn .chev{transform:rotate(180deg)}
.lang-menu{
  position:absolute;top:calc(100% + 6px);right:0;z-index:300;min-width:140px;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);overflow:hidden;
  display:none;flex-direction:column;animation:pop .12s ease-out;
}
.lang.open .lang-menu{display:flex}
.lang-menu button{
  background:none;border:0;color:var(--text);font:inherit;font-size:13px;cursor:pointer;
  text-align:left;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.lang-menu button:hover{background:var(--hover)}
.lang-menu button.active{color:var(--blue)}
.lang-menu button .check{width:14px;height:14px;opacity:0;flex-shrink:0}
.lang-menu button.active .check{opacity:1}
.nav{display:flex;flex-direction:column;flex-shrink:0;padding-top:16px}
.nav button{
  background:none;border:0;color:var(--text);font:inherit;cursor:pointer;
  padding:9px 20px;text-align:left;display:flex;align-items:center;gap:10px;
  border-left:3px solid transparent;
}
.nav button:hover{background:var(--hover)}
.nav button.on{background:var(--hover);border-left-color:var(--blue);font-weight:500}
.nav .count{margin-left:auto;font-size:12px;color:var(--mute);background:var(--panel);padding:1px 8px;border-radius:10px;min-width:24px;text-align:center}
.nav .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.nav .dot.queued{background:var(--blue)}
.nav .dot.processing{background:var(--yellow)}
.nav .dot.done{background:var(--green)}
.nav .dot.failed{background:var(--red)}
.nav .dot.duplicate{background:var(--purple)}
.nav .dot.unsupported{background:var(--dim)}
.nav .dot.all{background:var(--text)}

.spacer{flex:1;min-height:8px}

/* cleanup section */
.cleanup{
  display:none;flex-direction:column;flex-shrink:0;
  border-top:1px solid var(--line);
}
.cleanup-head{
  padding:8px 20px;font-size:12px;color:var(--mute);font-weight:500;
  display:flex;align-items:center;gap:8px;
}
.cleanup-btn{
  background:none;border:0;cursor:pointer;font:inherit;
  padding:7px 20px;text-align:left;display:flex;align-items:center;gap:10px;
  color:var(--mute);font-size:13px;border-left:3px solid transparent;
  width:100%;
}
.cleanup-btn:hover{background:var(--hover);color:var(--red);border-left-color:var(--red)}
.cleanup-btn svg{width:14px;height:14px;flex-shrink:0;opacity:.5}
.cleanup-btn:hover svg{opacity:1}
.cleanup-btn .cc{margin-left:auto;font-size:12px;color:var(--dim);background:var(--panel);padding:1px 8px;border-radius:10px;min-width:24px;text-align:center}
.cleanup-btn.danger{color:var(--red);opacity:.7;border-top:1px solid var(--line);margin-top:2px}
.cleanup-btn.danger:hover{opacity:1}

/* live log */
.log{
  display:flex;flex-direction:column;min-height:0;
  border-top:1px solid var(--line);
}
.log-head{
  padding:8px 20px;font-size:12px;color:var(--mute);font-weight:500;
  display:flex;align-items:center;gap:8px;flex-shrink:0;
}
.log-head::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
.log-head.off::before{background:var(--dim);animation:none}
.log-head .clr{margin-left:auto;cursor:pointer;font-size:10px;color:var(--dim);text-transform:none;letter-spacing:0}
.log-head .clr:hover{color:var(--text)}
.log-body{
  height:220px;overflow-y:auto;padding:2px 0;
  scrollbar-width:thin;scrollbar-color:#333 transparent;
}
.log-body::-webkit-scrollbar{width:4px}
.log-body::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px}
.log-line{
  padding:4px 20px;display:flex;align-items:flex-start;gap:8px;
  animation:slide .12s ease-out;
  border-left:2px solid transparent;
}
.log-line:hover{background:var(--hover)}
.log-line .ldot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:5px}
.log-line .ts{font-size:11px;color:var(--dim);flex-shrink:0;padding-top:1px}
.log-line .msg{font-size:12px;color:var(--mute);word-break:break-word;min-width:0}
.log-line.INFO  .ldot{background:var(--blue)}
.log-line.INFO  .msg{color:var(--mute)}
.log-line.WARNING .ldot{background:var(--yellow)}
.log-line.WARNING .msg{color:var(--yellow)}
.log-line.WARNING{border-left-color:rgba(255,214,10,.2)}
.log-line.ERROR .ldot{background:var(--red)}
.log-line.ERROR .msg{color:var(--red)}
.log-line.ERROR{border-left-color:rgba(242,139,130,.2)}
.log-line.DEBUG .ldot{background:var(--dim)}
.log-line.DEBUG .msg{color:var(--dim)}
@keyframes slide{from{transform:translateX(-4px);opacity:0}}

@keyframes pulse{50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:translateY(-6px);opacity:0}}

/* main */
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:14px 24px;border-bottom:1px solid var(--line)}

/* live rate strip */
.rates{display:flex;gap:24px;padding:10px 24px;border-bottom:1px solid var(--line);background:#161616;align-items:center}
.rate{display:flex;align-items:baseline;gap:6px}
.rate .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text);min-width:34px}
.rate .u{font-size:11px;color:var(--dim)}
.rate .l{font-size:12px;color:var(--mute);margin-left:4px}
.rate .arrow{font-size:14px;margin-right:2px}
.rate.in .arrow{color:var(--blue)}
.rate.out .arrow{color:var(--green)}
.rate.act .v{color:var(--yellow)}
.rate.eta .v{color:var(--purple);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
.rate.eta .v.loading{color:var(--mute);font-size:14px;font-weight:500}
.rate.eta .info{
  position:relative;
  display:inline-grid;place-items:center;width:13px;height:13px;
  border:1px solid var(--dim);border-radius:50%;
  font-size:9px;font-weight:600;color:var(--dim);
  cursor:default;font-style:italic;font-family:Georgia,serif;
}
.rate.eta .info:hover{color:var(--text);border-color:var(--mute)}
.rate.eta .info::after{
  content:attr(data-tip);
  position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);
  background:var(--panel);color:var(--text);
  border:1px solid var(--line);border-radius:6px;
  padding:6px 10px;font-size:11px;font-weight:400;font-style:normal;
  font-family:Inter,system-ui,sans-serif;
  white-space:nowrap;pointer-events:none;
  opacity:0;visibility:hidden;transition:opacity .12s, visibility .12s;
  box-shadow:0 4px 16px rgba(0,0,0,.4);z-index:50;
}
.rate.eta .info::before{
  content:'';position:absolute;left:50%;top:calc(100% + 2px);transform:translateX(-50%) rotate(45deg);
  width:7px;height:7px;background:var(--panel);
  border-left:1px solid var(--line);border-top:1px solid var(--line);
  pointer-events:none;opacity:0;visibility:hidden;transition:opacity .12s, visibility .12s;z-index:51;
}
.rate.eta .info:hover::after,.rate.eta .info:hover::before{opacity:1;visibility:visible}
.rate.tput{margin-left:auto;color:var(--dim);font-size:12px}
.rate.tput b{color:var(--mute);font-weight:500}
.spark{display:flex;align-items:flex-end;gap:1px;height:18px;margin-left:6px}
.spark span{width:3px;background:var(--line);border-radius:1px;transition:height .3s}
.rate.in .spark span.hot{background:var(--blue)}
.rate.out .spark span.hot{background:var(--green)}
.search{flex:1;max-width:480px;position:relative}
.search input{
  width:100%;background:var(--panel);border:1px solid transparent;border-radius:20px;
  padding:8px 14px 8px 38px;color:var(--text);font:inherit;
}
.search input:focus{outline:0;background:var(--bg);border-color:var(--line)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:.6}
.bulk{display:none;align-items:center;gap:8px;animation:pop .15s ease-out}
.bulk.show{display:flex}
.bulk .n{color:var(--mute);font-size:13px;margin-right:4px}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:6px 14px;border-radius:18px;cursor:pointer;font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn.r{color:var(--green);border-color:#2a4a32}
.btn.r:hover{background:#1a2a20}
.btn.d{color:var(--red);border-color:#4a2a2a}
.btn.d:hover{background:#2a1a1a}
.btn.s{padding:5px 14px;font-size:12px}

/* table */
.scroll{flex:1;overflow:auto}
table{width:100%;border-collapse:collapse}
thead{position:sticky;top:0;background:var(--bg);z-index:1}
th{text-align:left;padding:10px 16px;font-size:12px;font-weight:500;color:var(--mute);border-bottom:1px solid var(--line)}
th:first-child,td:first-child{padding-left:24px;width:36px}
td{padding:10px 16px;border-bottom:1px solid #1a1a1a;vertical-align:middle}
tr:hover td{background:var(--panel)}
tr.sel td,#rows.all-sel tr td{background:#1c2a3a}

/* incremental update animations — replaces the full-list flash */
@keyframes rowFadeIn{from{opacity:0}to{opacity:1}}
@keyframes rowEnterFlash{
  0%{background:rgba(62,166,255,.18)}
  100%{background:transparent}
}
@keyframes rowUpdateFlash{
  0%{background:rgba(255,214,10,.14)}
  100%{background:transparent}
}
tr.row-new{animation:rowFadeIn .22s ease-out}
tr.row-new td{animation:rowEnterFlash .9s ease-out}
tr.row-upd td{animation:rowUpdateFlash .7s ease-out}

input[type=checkbox]{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1.5px solid var(--dim);border-radius:3px;cursor:pointer;background:transparent;display:grid;place-content:center;flex-shrink:0}
input[type=checkbox]:checked{background:var(--blue);border-color:var(--blue)}
input[type=checkbox]:checked::after{content:'';width:5px;height:9px;border:solid #000;border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:-2px}

.fn{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.muted{color:var(--mute);font-size:13px}
.dim{color:var(--dim);font-size:13px}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.badge::before{content:'';width:8px;height:8px;border-radius:50%}
.badge.queued::before{background:var(--blue)}
.badge.processing::before{background:var(--yellow);animation:pulse 1s infinite}
.badge.done::before{background:var(--green)}
.badge.failed::before{background:var(--red)}
.badge.duplicate::before{background:var(--purple)}
.badge.unsupported::before{background:var(--dim)}
.badge.deleted::before{background:#444}
.badge.queued{color:var(--blue)}
.badge.processing{color:var(--yellow)}
.badge.done{color:var(--green)}
.badge.failed{color:var(--red)}
.badge.duplicate{color:var(--purple)}
.badge.unsupported,.badge.deleted{color:var(--dim)}

.actions{display:flex;gap:6px;justify-content:flex-end}

#empty{padding:80px;text-align:center;color:var(--dim)}

/* progress toasts (stacked bottom-right) */
#toast-stack{
  position:fixed;bottom:24px;right:24px;z-index:200;
  display:flex;flex-direction:column;gap:10px;align-items:flex-end;
  pointer-events:none;
}
.toast{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:14px 18px;min-width:220px;max-width:300px;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
  display:flex;flex-direction:column;gap:8px;
  animation:pop .2s ease-out;transition:opacity .2s;pointer-events:auto;
}
.toast-title{font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;color:var(--text)}
.toast-title svg{width:14px;height:14px;flex-shrink:0}
.toast-bar-wrap{background:var(--line);border-radius:3px;height:3px}
.toast-bar{height:100%;border-radius:3px;transition:width .15s,background .3s;width:0%}
.toast-sub{font-size:11px;color:var(--dim)}

/* modal */
#modal-overlay{
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.65);backdrop-filter:blur(2px);
  display:none;align-items:center;justify-content:center;
}
#modal-overlay.show{display:flex}
#modal-box{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:24px 28px;min-width:320px;max-width:440px;width:90%;
  box-shadow:0 16px 48px rgba(0,0,0,.6);
  animation:pop .15s ease-out;display:flex;flex-direction:column;gap:14px;
}
.modal-title{font-size:15px;font-weight:600;color:var(--text)}
.modal-msg{font-size:13px;color:var(--mute);line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:50vh;overflow-y:auto}
.modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.modal-cancel{background:none;border:1px solid var(--line);color:var(--mute);padding:7px 18px;border-radius:18px;cursor:pointer;font:inherit;font-size:13px}
.modal-cancel:hover{background:var(--hover);color:var(--text)}
.modal-confirm{background:#3a1a1a;border:1px solid #6a2a2a;color:var(--red);padding:7px 18px;border-radius:18px;cursor:pointer;font:inherit;font-size:13px;font-weight:500}
.modal-confirm:hover{background:#4a2020}

/* upload drop zone (sidebar) */
.dz-wrap{border-top:1px solid var(--line);padding:10px 0 8px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.dz-pick{position:relative;margin:0 12px}
#drop-zone{
  padding:10px 14px;
  border:1.5px dashed var(--line);border-radius:8px;
  display:flex;align-items:center;gap:10px;
  cursor:pointer;transition:border-color .15s,background .15s,opacity .15s;
  background:#111;flex-shrink:0;
}
#drop-zone:hover,#drop-zone.drag{border-color:var(--blue);background:rgba(62,166,255,.04)}
#drop-zone svg{width:16px;height:16px;flex-shrink:0;color:var(--dim)}
#drop-zone:hover svg,#drop-zone.drag svg{color:var(--blue)}
#drop-zone .dz-text{font-size:12px;color:var(--mute)}
#dz-input,#dz-dir{display:none}
/* click-the-field menu: pick files OR a folder (a native dialog can't do both) */
#dz-menu{
  position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:60;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);overflow:hidden;
  display:none;flex-direction:column;animation:pop .12s ease-out;
}
#dz-menu.show{display:flex}
#dz-menu button{
  background:none;border:0;color:var(--text);font:inherit;font-size:13px;
  text-align:left;padding:9px 14px;cursor:pointer;
  display:flex;align-items:center;gap:9px;
}
#dz-menu button svg{width:15px;height:15px;flex-shrink:0;opacity:.85}
#dz-menu button:hover{background:var(--hover);color:var(--blue)}
.up-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
#up-cancel{
  background:none;border:0;color:var(--dim);font:inherit;font-size:11px;
  cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px;flex-shrink:0;
}
#up-cancel:hover{color:var(--red)}
/* resume chips (shown after a refresh / browser restart) */
#resume-bar{margin:0 12px;display:flex;flex-direction:column;gap:5px}
#resume-bar:empty{display:none}
.resume-chip{
  display:flex;align-items:center;gap:8px;font-size:11px;
  background:rgba(62,166,255,.06);border:1px solid rgba(62,166,255,.2);
  border-radius:7px;padding:6px 9px;color:var(--mute);cursor:pointer;
}
.resume-chip:hover{background:rgba(62,166,255,.12);color:var(--text)}
.resume-chip .rc-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume-chip .rc-pct{flex-shrink:0;color:var(--blue);font-variant-numeric:tabular-nums}
/* active upload progress */
#upload-progress{margin:0 12px;font-size:11px;color:var(--dim);display:none;flex-direction:column;gap:4px}
#upload-progress.show{display:flex}
.up-row{display:flex;align-items:center;gap:8px;font-size:11px}
#up-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;color:var(--mute)}
#up-pct{flex-shrink:0;font-variant-numeric:tabular-nums;color:var(--mute)}
#up-bar-wrap{background:var(--line);border-radius:3px;height:3px;overflow:hidden}
#up-bar{height:100%;border-radius:3px;background:var(--blue);transition:width .15s,background .3s;width:0%}
#up-bar.done{background:var(--green)}
#up-bar.err{background:var(--red)}
#up-stats{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}

</style>
</head>
<body>

<aside>
  <div class="nav" id="nav">
    <button data-f="" class="on"><span class="dot all"></span><span data-i18n="nav.all">Alle</span><span class="count" id="c-total">0</span></button>
    <button data-f="queued"><span class="dot queued"></span><span data-i18n="nav.queued">Warteschlange</span><span class="count" id="c-queued">0</span></button>
    <button data-f="processing"><span class="dot processing"></span><span data-i18n="nav.processing">In Arbeit</span><span class="count" id="c-processing">0</span></button>
    <button data-f="done"><span class="dot done"></span><span data-i18n="nav.done">Fertig</span><span class="count" id="c-done">0</span></button>
    <button data-f="failed"><span class="dot failed"></span><span data-i18n="nav.failed">Fehlgeschlagen</span><span class="count" id="c-failed">0</span></button>
    <button data-f="duplicate"><span class="dot duplicate"></span><span data-i18n="nav.duplicate">Duplikate</span><span class="count" id="c-duplicates">0</span></button>
    <button data-f="unsupported"><span class="dot unsupported"></span><span data-i18n="nav.unsupported">Nicht unterstützt</span><span class="count" id="c-unsupported">0</span></button>
  </div>
  <div class="spacer"></div>
  <div class="cleanup" id="cleanup">
    <div class="cleanup-head" data-i18n="cleanup">Aufräumen</div>
    <button class="cleanup-btn" id="purge-failed" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      <span data-i18n="cleanup.failed">Alle fehlgeschlagenen löschen</span><span class="cc" id="cc-failed">0</span>
    </button>
    <button class="cleanup-btn" id="purge-dup" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      <span data-i18n="cleanup.dup">Alle Duplikate löschen</span><span class="cc" id="cc-dup">0</span>
    </button>
    <button class="cleanup-btn" id="purge-uns" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>

window.fetch=async(...a)=>{

};

// Localise a server-pushed activity-log line for DISPLAY only (the raw text is
// still used for the rate-tracking regexes). Unknown lines pass through as-is.
function localizeLog(msg){
  let m;
  if(m=msg.match(/^Queued: (.+)$/)) return tf('log.queued',{name:m[1]});
  if(m=msg.match(/^Processing: (.+)$/)) return tf('log.processing',{name:m[1]});
  if(m=msg.match(/^Done: (.+) \((\d+) chunks\)$/)) return tf('log.done',{name:m[1],n:m[2]});
  if(m=msg.match(/^Duplicate: (.+)$/)) return tf('log.duplicate',{name:m[1]});
  if(m=msg.match(/^Unsupported: (.+)$/)) return tf('log.unsupported',{name:m[1]});
  if(m=msg.match(/^Failed: (.+?) — (.+)$/)) return tf('log.failed',{name:m[1],err:m[2]});
  if(m=msg.match(/^Upload complete: (.+)$/)) return tf('log.upcomplete',{name:m[1]});
  return msg;
}
function t(k){return (I18N[LANG]&&I18N[LANG][k])||I18N.de[k]||k;}
function tf(k,p){let s=t(k);for(const x in p)s=s.split('{'+x+'}').join(p[x]);return s;}
const fileWord=n=>n===1?t('file.one'):t('file.many');
function applyI18n(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-title]').forEach(el=>el.title=t(el.dataset.i18nTitle));
  // Re-localise already-rendered activity-log lines (raw text kept in data-msg).
  document.querySelectorAll('#log-body .log-line').forEach(line=>{
    const raw=line.dataset.msg; if(raw==null) return;
    const me=line.querySelector('.msg'); if(me) me.textContent=localizeLog(raw);
  });
  const cur=$('lang-cur');if(cur)cur.textContent=LANG_NAMES[LANG];   // button shows the CURRENT language
  document.querySelectorAll('#lang-menu button').forEach(b=>b.classList.toggle('active',b.dataset.lang===LANG));
}
function setLang(lang){if(!LANG_NAMES[lang]||lang===LANG)return;LANG=lang;localStorage.setItem('lang',LANG);applyI18n();load();}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sz=b=>!b?'—':b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB';
const dtLoc=()=>LANG==='de'?'de-DE':'en-US';   // dates follow the chosen UI language
// today → time · this year → day+month · older → day+month+year. Full
// timestamp on hover via dtFull(). Follows the chosen UI language (dtLoc).
const dt=s=>{
  if(!s)return'—';
  const d=new Date(s),now=new Date(),L=dtLoc();
  if(d.toDateString()===now.toDateString())   return d.toLocaleTimeString(L,{hour:'2-digit',minute:'2-digit'});
  if(d.getFullYear()===now.getFullYear())     return d.toLocaleDateString(L,{day:'numeric',month:'short'});
  return d.toLocaleDateString(L,{day:'numeric',month:'short',year:'numeric'});
};
const dtFull=s=>{if(!s)return'';try{return new Date(s).toLocaleString(dtLoc());}catch{return''}};

// When delete-after-ingest is on, a failed file's bytes are gone, so it can't
// be retried from disk — you re-upload instead. Hide the retry affordances.
const DELETE_AFTER_INGEST={{ delete_after_ingest|tojson }};
let F='',S='',selected=new Set(),files=[];
let pageOffset=0,hasMore=true,loadingMore=false;
const PAGE=200;
let reloadDebounce=null;

// ── Modal (replaces browser confirm()) ───────────────────────────────────
let _modalResolve=null;
function showModal(title,msg,confirmLabel=t('delete'),danger=true){
  return new Promise(resolve=>{
    _modalResolve=resolve;
    $('modal-title').textContent=title;
    $('modal-msg').textContent=msg;
    $('modal-confirm').textContent=confirmLabel;
    const c=$('modal-confirm');
    // info-only popup (confirm label == "Close"): muted style + hide Cancel
    const isInfo=confirmLabel===t('close');
    $('modal-cancel').style.display=isInfo?'none':'';
    if(isInfo){c.style.background='var(--panel)';c.style.borderColor='var(--line)';c.style.color='var(--text)';}
    else if(danger){c.style.background='#3a1a1a';c.style.borderColor='#6a2a2a';c.style.color='var(--red)';}
    else{c.style.background='#1a3a1a';c.style.borderColor='#2a6a2a';c.style.color='var(--green)';}
    $('modal-overlay').classList.add('show');
    $('modal-confirm').focus();
  });
}
$('modal-confirm').onclick=()=>{$('modal-overlay').classList.remove('show');if(_modalResolve){_modalResolve(true);_modalResolve=null;}};
$('modal-cancel').onclick=()=>{$('modal-overlay').classList.remove('show');if(_modalResolve){_modalResolve(false);_modalResolve=null;}};
$('modal-overlay').onclick=e=>{if(e.target===$('modal-overlay')){$('modal-overlay').classList.remove('show');if(_modalResolve){_modalResolve(false);_modalResolve=null;}}};
document.addEventListener('keydown',e=>{
  if(!$('modal-overlay').classList.contains('show'))return;
  if(e.key==='Escape'){$('modal-overlay').classList.remove('show');if(_modalResolve){_modalResolve(false);_modalResolve=null;}}
  else if(e.key==='Enter'){$('modal-overlay').classList.remove('show');if(_modalResolve){_modalResolve(true);_modalResolve=null;}}
});

// ── Render bulk bar ───────────────────────────────────────────────────────
function renderBulk(){
  const n=selected.size;
  $('sel-n').textContent=n;
  $('bulk').classList.toggle('show',n>0);
  const tbody=$('rows');
  const allVis=files.length>0&&files.every(f=>selected.has(f.id));
  if(allVis){
    // O(1): one CSS class covers all rows instantly
    tbody.classList.add('all-sel');
  } else {
    tbody.classList.remove('all-sel');
    // Only touch rows whose state actually changed
    tbody.querySelectorAll('tr[data-id]').forEach(tr=>{
      const want=selected.has(tr.dataset.id);
      if(tr.classList.contains('sel')!==want) tr.classList.toggle('sel',want);
    });
  }
  $('all-cb').checked=allVis&&n>0;
  $('all-cb').indeterminate=n>0&&!allVis;
  const selFiles=files.filter(f=>selected.has(f.id));
  const allRetryable=!DELETE_AFTER_INGEST&&selFiles.length>0&&selFiles.every(f=>f.status==='failed');
  $('b-retry').style.display=allRetryable?'':'none';
}

// ── Row builder ───────────────────────────────────────────────────────────
function rowActions(f){
  const a=[];
  if(f.status==='failed') a.push(`<button class="btn s" onclick="showErr('${f.id}')" title="${esc(t('why'))}">${esc(t('why'))}</button>`);
  if(f.status==='failed'&&!DELETE_AFTER_INGEST) a.push(`<button class="btn s r" onclick="rt('${f.id}')">${esc(t('retry'))}</button>`);
  if(f.status!=='deleted') a.push(`<button class="btn s d" onclick="del('${f.id}')">${esc(t('delete'))}</button>`);
  return a.join('');
}
async function showErr(id){
  try{
    const r=await fetch(`/files/${id}/error`).then(r=>r.json());
    const msg=(r.error||t('err.none')).slice(0,4000);
    await showModal(tf('failedTitle',{name:r.filename}), msg, t('close'), false);
  }catch(e){toastError(t('err.load'));}
}
function makeRow(f){
  const tr=document.createElement('tr');
  tr.dataset.id=f.id;
  if(selected.has(f.id)) tr.classList.add('sel');
  tr.innerHTML=
    `<td><input type="checkbox"${selected.has(f.id)?' checked':''} onchange="tog('${f.id}',this.checked)"></td>`+
    `<td><div class="fn" title="${esc(f.filename)}">${esc(f.filename)}</div></td>`+
    `<td><span class="badge ${f.status}">${esc(t('status.'+f.status)||f.status)}</span></td>`+
    `<td class="muted">${f.qdrant_chunk_count??'—'}</td>`+
    `<td class="muted">${sz(f.file_size_bytes)}</td>`+
    `<td class="dim" title="${esc(dtFull(f.ingested_at||f.created_at))}">${dt(f.ingested_at||f.created_at)}</td>`+
    `<td><div class="actions">${rowActions(f)}</div></td>`;
  return tr;
}

// ── Counts + purge button visibility ─────────────────────────────────────
function updateCounts(s){
  $('c-total').textContent=s.total;
  $('c-queued').textContent=s.queued;
  $('c-processing').textContent=s.processing;
  $('c-done').textContent=s.done;
  $('c-failed').textContent=s.failed;
  $('c-duplicates').textContent=s.duplicates;
  $('c-unsupported').textContent=s.unsupported;

  // Cleanup section — show only when something needs cleaning
  const errors=s.failed+s.duplicates+s.unsupported;
  $('cleanup').style.display=errors>0?'flex':'none';
  function cbtn(id,ccid,n){$('cc-'+ccid).textContent=n;$('purge-'+id).style.display=n>0?'flex':'none';}
  cbtn('failed','failed',s.failed);
  cbtn('dup',   'dup',   s.duplicates);
  cbtn('uns',   'uns',   s.unsupported);
}

// ── Load first page + reset ───────────────────────────────────────────────
function fileQS(offset){
  return '/files?'+(F?`status=${encodeURIComponent(F)}&`:'')+(S?`search=${encodeURIComponent(S)}&`:'')+`offset=${offset}&limit=${PAGE}`;
}

async function load(preserveSel=false){
  pageOffset=0; hasMore=true; files=[];
  if(!preserveSel){ selected.clear(); $('rows').classList.remove('all-sel'); }
  $('rows').innerHTML='';
  try{
    const [s,batch]=await Promise.all([
      fetch('/status').then(r=>r.json()),
      fetch(fileQS(0)).then(r=>r.json())
    ]);
    updateCounts(s);
    appendBatch(batch);
    if(batch.length<PAGE) hasMore=false;
    $('empty').style.display=files.length?'none':'block';
    // Search/filter hint
    const hint=$('search-hint');
    if(S||F){
      const n=files.length;
      const plus=hasMore?'+':'';
      hint.textContent=S?`${n}${plus} ${t('hint.matches')}`:`${n}${plus} ${t('hint.files')}`;
      hint.style.display='';

function appendBatch(batch){
  files=[...files,...batch];
  pageOffset+=batch.length;
  const frag=document.createDocumentFragment();
  batch.forEach(f=>frag.appendChild(makeRow(f)));
  $('rows').appendChild(frag);
  renderBulk();
  // Keep hint count in sync as more pages load
  const hint=$('search-hint');
  if(hint.style.display!=='none'&&hint.textContent){
    const n=files.length,plus=hasMore?'+':'';
    hint.textContent=S?`${n}${plus} ${t('hint.matches')}`:`${n}${plus} ${t('hint.files')}`;
  }
}

async function loadMore(){
  if(loadingMore||!hasMore) return;
  loadingMore=true;
  try{
    const batch=await fetch(fileQS(pageOffset)).then(r=>r.json());
    // Deduplicate against what's already loaded — when new files arrive at the
    // top mid-session the API offset shifts, so the next page can overlap.
    const known=new Set(files.map(f=>f.id));
    const fresh=batch.filter(f=>!known.has(f.id));
    appendBatch(fresh);
    if(batch.length<PAGE) hasMore=false;
  }catch(e){console.error('loadMore',e);}
  finally{loadingMore=false;}
}

// Diff-based refresh — adds new rows at top with a soft slide-in, flashes
// rows whose status changed, never blows the whole table away.
async function smartRefresh(){
  try{
    const [s,batch]=await Promise.all([
      fetch('/status').then(r=>r.json()),
      fetch(fileQS(0)).then(r=>r.json())
    ]);
    updateCounts(s);

    const tbody=$('rows');
    const oldById=new Map(files.map(f=>[f.id,f]));
    const newIds=new Set(batch.map(f=>f.id));

    const toAdd=[];
    const toUpdate=[];
    for(const nf of batch){
      const of_=oldById.get(nf.id);
      if(!of_){toAdd.push(nf);continue;}
      if(of_.status!==nf.status||
         of_.qdrant_chunk_count!==nf.qdrant_chunk_count||
         of_.file_size_bytes!==nf.file_size_bytes||
         of_.error_message!==nf.error_message){
        toUpdate.push(nf);
      }
    }

    // Update existing rows in place — replace cells, keep the <tr> node so
    // selection state and animations don't restart.
    for(const f of toUpdate){
      const tr=tbody.querySelector(`tr[data-id="${f.id}"]`);
      if(!tr) continue;
      const fresh=makeRow(f);
      tr.innerHTML=fresh.innerHTML;
      const idx=files.findIndex(x=>x.id===f.id);
      if(idx!==-1) files[idx]=f;
      tr.classList.remove('row-upd');void tr.offsetWidth;
      tr.classList.add('row-upd');
    }

    // Add brand-new rows at the top (batch is created_at DESC). Reverse so
    // the most recent ends up topmost when prepended one at a time.
    if(toAdd.length){
      const frag=document.createDocumentFragment();
      for(const f of toAdd){
        const tr=makeRow(f);
        tr.classList.add('row-new');
        frag.appendChild(tr);
      }
      tbody.prepend(frag);
      files=[...toAdd,...files];
      pageOffset=files.length;
      // Strip the animation class after it plays so it can re-trigger later.
      setTimeout(()=>tbody.querySelectorAll('tr.row-new').forEach(t=>t.classList.remove('row-new')),900);
    }

    // Drop rows that vanished from the first page AND aren't in our deeper
    // pagination cache — only safe within the first PAGE rows since we
    // can't know what's beyond. Skip removal otherwise to avoid false drops.
    if(files.length<=PAGE){
      const removed=files.filter(f=>!newIds.has(f.id));
      for(const f of removed){
        const tr=tbody.querySelector(`tr[data-id="${f.id}"]`);
        if(tr){
          tr.style.transition='opacity .2s';
          tr.style.opacity='0';
          setTimeout(()=>tr.remove(),200);
        }
        selected.delete(f.id);
      }
      files=files.filter(f=>newIds.has(f.id));
    }

    $('empty').style.display=files.length?'none':'block';
    if(toUpdate.length||toAdd.length) renderBulk();
  }catch(e){console.error('smartRefresh',e);}
}

const _DEL_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>';

  const el=document.createElement('div');

  function progress(title,done,total){
    clearTimeout(timer);

    titleEl.textContent=title;
    let sub=total>1?`${done} / ${total} ${t('hint.files')}`:'';
    if(done>0&&total>1){const e2=(Date.now()-start)/1000,rate=done/e2,rem=total-done;if(rate>0&&rem>0)sub+=` · ~${Math.ceil(rem/rate)}s ${LANG==='de'?'übrig':'left'}`;}

  try{
    for(let i=0;i<ids.length;i+=BATCH){
      const batch=ids.slice(i,i+BATCH);
      const res=await fetch('/files/bulk/delete?delete_physical=true',{
        method:'POST',headers:{'Content-Type':'application/json'},

      }).then(r=>{if(!r.ok)throw new Error('delete '+r.status);return r.json();});

  }catch(e){

// ── Live rates (exponential decay, no sliding window) ────────────────────
// Each event contributes exp(-Δt / τ) to the rate. Two τ values are tracked:
//   TAU      = 3s   → snappy display rate, drops near zero in 6–8s
//   TAU_ETA  = 15s  → smoother rate for ETA, less jitter when files vary
const TAU=5;
const TAU_ETA=15;
const SPARK_BUCKETS=20;
const SPARK_WINDOW_MS=5_000;
const PRUNE_HORIZON_MS=Math.max(SPARK_WINDOW_MS,TAU_ETA*8*1000);   // ~120s
const REPLAY_CUTOFF_MS=10_000;      // ignore SSE-replay events older than this

const inEvents=[],outEvents=[];

function buildSpark(id){const el=$(id);for(let i=0;i<SPARK_BUCKETS;i++){const b=document.createElement('span');b.style.height='2px';el.appendChild(b)}}
buildSpark('spark-in');buildSpark('spark-out');

function trackEvent(msg,t){
  // Each SSE connection replays the last ~300 buffered lines so the activity
  // log survives reloads. Those replays carry their original timestamps and
  // would otherwise spike the live rate when the page is refreshed mid-run.
  const evtTs=t?new Date(t).getTime():Date.now();
  if(Date.now()-evtTs>REPLAY_CUTOFF_MS) return;

  if(/^Queued:/.test(msg))inEvents.push(evtTs);
  else if(/^Done:/.test(msg)||/^Failed:/.test(msg))outEvents.push(evtTs);
}
function prune(a){const c=Date.now()-PRUNE_HORIZON_MS;while(a.length&&a[0]<c)a.shift();}
function liveRate(arr,tau){
  const now=Date.now();let s=0;
  for(let i=arr.length-1;i>=0;i--){
    const dt=(now-arr[i])/1000;
    if(dt>tau*8)break;             // negligible weight — array is time-ordered
    s+=Math.exp(-dt/tau);
  }
  return s/tau;                    // events per second
}
function paintSpark(id,arr){
  const el=$(id),now=Date.now(),bs=SPARK_WINDOW_MS/SPARK_BUCKETS;
  const counts=new Array(SPARK_BUCKETS).fill(0);
  for(const t of arr){
    const dt=now-t;
    if(dt<SPARK_WINDOW_MS) counts[Math.min(SPARK_BUCKETS-1,Math.floor((SPARK_WINDOW_MS-dt)/bs))]++;
  }
  const max=Math.max(2,...counts);
  el.querySelectorAll('span').forEach((s,i)=>{s.style.height=Math.max(2,Math.round((counts[i]/max)*16))+'px';s.classList.toggle('hot',counts[i]>0);});
}
function fmtETA(sec){
  if(!isFinite(sec)||sec<=0)return '—';
  if(sec<60)return Math.round(sec)+'s';
  if(sec<3600){const m=Math.floor(sec/60),s=Math.round(sec%60);return m+'m'+(s?' '+s+'s':'');}
  const h=Math.floor(sec/3600),m=Math.round((sec%3600)/60);
  return h+'h'+(m?' '+m+'m':'');
}
function updateRates(){
  prune(inEvents);prune(outEvents);
  const rIn=liveRate(inEvents,TAU);
  const rOut=liveRate(outEvents,TAU);
  const rOutEta=liveRate(outEvents,TAU_ETA);     // smoother for ETA
  $('r-in').textContent=rIn.toFixed(1);
  $('r-out').textContent=rOut.toFixed(1);
  const remaining=(parseInt($('c-queued').textContent)||0)+(parseInt($('c-processing').textContent)||0);
  // Compute desired state, then only mutate DOM if it changed. Rewriting
  // the inner HTML every tick would destroy the <span class="info"> node
  // and reset its hover state — making the tooltip blink each tick.
  let mode,text;
  if(remaining<=0)        { mode='idle';    text='—'; }
  else if(rIn>0.3)        { mode='loading'; text=t('rate.loading'); }
  else if(rOutEta>0.05)   { mode='eta';     text=fmtETA(remaining/rOutEta); }
  else                    { mode='waiting'; text='…'; }
  setEtaDisplay(mode,text);
  paintSpark('spark-in',inEvents);paintSpark('spark-out',outEvents);
}

let _etaState={mode:null,text:null};
function setEtaDisplay(mode,text){
  if(_etaState.mode===mode&&_etaState.text===text) return;
  const eta=$('r-eta');
  if(mode!==_etaState.mode){
    if(mode==='loading'){
      eta.classList.add('loading');
      eta.innerHTML=`<span id="r-eta-text">${esc(t('rate.loading'))}</span> <span class="info" data-tip="${esc(t('eta.tip'))}">i</span>`;
    } else {
      eta.classList.remove('loading');
      eta.textContent=text;
    }
  } else if(mode==='loading'){
    // Same loading state, just refresh the text label without touching the i.
    const el=document.getElementById('r-eta-text');
    if(el&&el.textContent!==text) el.textContent=text;
  } else if(eta.textContent!==text){
    eta.textContent=text;
  }
  _etaState={mode,text};
}
setInterval(updateRates,500);      // 2 Hz refresh — feels live

const MAX_LINES=300;
let es=null;
function fmtTime(iso){return new Date(iso).toLocaleTimeString(dtLoc(),{hour:'2-digit',minute:'2-digit',second:'2-digit'});}

function scheduleReload(){
  // Throttle to one diff-refresh per 1s. Uses smartRefresh (incremental,
  // animated) instead of full load() so the table doesn't flash.
  const now=Date.now();

  function updateUI(){
    let total=0,sent=0,done=0,n=0,upName='';
    for(const j of jobs.values()){if(j.skipped)continue;n++;total+=j.size;sent+=Math.min(j.offset,j.size);if(j.state==='done')done++;else if(j.state==='up'&&!upName)upName=j.name;}
    if(!n)return;
    const pct=total>0?Math.min(100,Math.round(sent/total*100)):0;
    upBar.style.width=pct+'%';upPct.textContent=pct+'%';
    upLabel.textContent=n>1?tf('up.uploadingN',{done,n}):(upName||[...jobs.values()][0].name);
    const now=performance.now();
    if(now-_emaT>=200){const inst=(sent-_emaLoaded)/Math.max(0.001,(now-_emaT)/1000);_ema=_ema?_ema*0.7+inst*0.3:inst;_emaT=now;_emaLoaded=sent;const left=_ema>0?(total-sent)/_ema:Infinity;upStats.textContent=sent<total?tf('up.speed',{r:fmtBytes(Math.max(0,_ema)),eta:fmtEta(left)}):'';}
  }

  function schedule(){
    if(cancelled)return;
    while(running<CONCURRENCY){
      const j=[...jobs.values()].find(x=>x.state==='wait'&&x.file);
      if(!j)break;
      j.state='up';j.ctrl=new AbortController();running++;
      uploadJob(j).then(()=>{j.state='done';},e=>{j.state='err';if(!cancelled)console.error('upload',j.name,e);})
        .finally(()=>{running--;schedule();idle();});
    }
    updateUI();
  }

  const stopped=j=>cancelled||(j.ctrl&&j.ctrl.signal.aborted);  // per-job: survives the global flag reset
  async function uploadJob(j){
    if(stopped(j))throw new Error('cancelled');
    // Early duplicate skip: if this exact content is already indexed, don't
    // upload it. Skipped for a RESUME (j.resumed) — a resumed file has a live
    // server partial and isn't ingested yet, so re-hashing the whole thing is
    // pure waste. Best-effort — any failure falls through to a normal upload.
    if(j.offset===0&&!j.resumed){
      try{
        const hash=await sha256Hex(j.file);
        if(hash){
          const pr=await fetch('/uploads/precheck',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hashes:[hash]})});
          if(pr.ok){const {known}=await pr.json();if(known&&known.includes(hash)){j.skipped=true;await jobDel(j.fp);return;}}
        }
      }catch{}
    }
    if(stopped(j))throw new Error('cancelled');
    // Create or resume on the server (idempotent by fingerprint → true offset).
    const cr=await fetch('/uploads',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({filename:j.name,size:j.size,fingerprint:j.fp}),signal:j.ctrl.signal});
    if(!cr.ok)throw new Error('create '+cr.status);
    const c=await cr.json();
    j.uploadId=c.upload_id;j.offset=c.offset;await jobPut(serial(j));

    let retry=0,recreated=0;
    while(j.offset<j.size){
      if(stopped(j))throw new Error('cancelled');
      const blob=j.file.slice(j.offset,j.offset+CHUNK);
      let r;
      try{
        r=await fetch('/uploads/'+j.uploadId,{method:'PATCH',
          headers:{'Upload-Offset':String(j.offset),'Content-Type':'application/offset+octet-stream'},body:blob,signal:j.ctrl.signal});
      }catch(netErr){
        if(stopped(j)||netErr.name==='AbortError')throw netErr;  // stop, don't retry
        if(++retry>MAX_RETRY)throw netErr;
        await sleep(Math.min(15000,500*2**retry),j.ctrl.signal);continue;   // backoff, abortable
      }
      retry=0;
      if(r.status===204||r.status===409){
        const off=parseInt(r.headers.get('Upload-Offset'));
        if(isNaN(off))throw new Error('bad Upload-Offset header');  // never advance blindly → no spin
        j.offset=off;
        await jobPut(serial(j));updateUI();
        if(r.headers.get('Upload-Complete')==='1')break;
      }else if(r.status===404){
        // Server dropped the partial (TTL/cancel). Recreate — but cap it so a
        // structural 404 can't busy-loop resending the whole file forever.
        if(++recreated>2)throw new Error('upload keeps disappearing server-side');
        if(stopped(j))throw new Error('cancelled');     // don't recreate a cancelled upload
        await sleep(1000,j.ctrl.signal);
        const c2=await fetch('/uploads',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({filename:j.name,size:j.size,fingerprint:j.fp}),signal:j.ctrl.signal});
        if(!c2.ok)throw new Error('recreate '+c2.status);
        const cc=await c2.json();j.uploadId=cc.upload_id;j.offset=cc.offset;await jobPut(serial(j));
      }else{
        throw new Error('patch '+r.status);
      }
    }
    await jobDel(j.fp);
  }

  function idle(){
    const busy=[...jobs.values()].some(j=>j.state==='wait'||j.state==='up');
    if(running||busy)return;
    const all=[...jobs.values()];
    if(!all.length)return;   // nothing to summarize (e.g. after cancel cleared jobs)
    const sk=all.filter(j=>j.skipped).length;
    const dn=all.filter(j=>j.state==='done').length-sk;   // actually uploaded
    const er=all.filter(j=>j.state==='err').length;
    const skTxt=sk?` · ${sk} ${t('indexed')}`:'';
    if(er){upBar.classList.add('err');upLabel.textContent=tf('up.donefail',{dn,er})+skTxt;upStats.textContent='';}
    else{upBar.classList.add('done');upBar.style.width='100%';upPct.textContent='100%';upLabel.textContent=tf('up.uploaded',{n:dn,files:fileWord(dn)})+skTxt;upStats.textContent='';}
    jobs.clear();_ema=0;_emaT=0;_emaLoaded=0;
    load();                                  // refresh the file table
    setTimeout(()=>{if(jobs.size===0&&!running)upProgress.classList.remove('show');},er?5000:3000);
    refreshResumeChips();
  }

  async function cancelAll(){
    if(!jobs.size&&!running)return;
    cancelled=true;
    const snap=[...jobs.values()];
    for(const j of snap){try{j.ctrl&&j.ctrl.abort();}catch{}}
    jobs.clear();
    upBar.classList.remove('done');upBar.classList.add('err');
    upLabel.textContent=t('up.cancelled');upStats.textContent='';upPct.textContent='';
    // Best-effort: drop the server-side partials and our local records.
    await Promise.allSettled(snap.map(async j=>{
      await jobDel(j.fp).catch(()=>{});
      if(j.uploadId){try{await _origFetch('/uploads/'+j.uploadId,{method:'DELETE'});}catch{}}
    }));
    cancelled=false;   // per-job signal (stopped()) still halts the aborted jobs
    schedule();        // flush anything the user enqueued during the cancel window
    setTimeout(()=>{if(!jobs.size&&!running){upProgress.classList.remove('show');upBar.classList.remove('err');}},2000);
    refreshResumeChips();
  }

  async function enqueue(file,handle,resumed,gid){
    const fp=fpOf(file);
    if(jobs.has(fp))return;
    const j={file,handle:handle||null,fp,name:file.name,size:file.size,lastModified:file.lastModified,offset:0,uploadId:null,state:'wait',resumed:!!resumed,gid:gid||null};
    jobs.set(fp,j);await jobPut(serial(j));
    showProg();schedule();
  }

  // Walk dropped folders recursively → flat File[] (folders themselves skipped).
  async function collectFiles(dt){
    const items=dt.items;
    if(!items||!items.length||!items[0].webkitGetAsEntry)return [...dt.files];
    const out=[];
    const walk=async entry=>{
      if(entry.isFile){out.push(await new Promise((res,rej)=>entry.file(res,rej)));}
      else if(entry.isDirectory){const rd=entry.createReader();while(true){const b=await new Promise((res,rej)=>rd.readEntries(res,rej));if(!b.length)break;for(const e of b)await walk(e);}}
    };
    for(const it of items){const e=it.webkitGetAsEntry&&it.webkitGetAsEntry();if(e)await walk(e);}
    return out;
  }

  async function pick(){
    if(hasFS){
      try{const handles=await window.showOpenFilePicker({multiple:true});for(const h of handles){const f=await h.getFile();await enqueue(f,h);}return;}
      catch(err){if(err&&err.name==='AbortError')return;/* fall through to input */}
    }
    dzInput.click();
  }
  // Recurse a picked directory → enqueue every file (with its handle + group id
  // on Chromium so the WHOLE folder resumes with one permission grant).
  async function walkDir(dh,gid){
    for await (const entry of dh.values()){
      if(entry.kind==='file'){try{await enqueue(await entry.getFile(),entry,false,gid);}catch{}}
      else if(entry.kind==='directory'){await walkDir(entry,gid);}
    }
  }
  const newGid=()=>(crypto.randomUUID?crypto.randomUUID():'g'+Date.now()+Math.random().toString(16).slice(2));
  async function pickFolder(){
    if(hasDir){
      try{
        const dh=await window.showDirectoryPicker();
        const gid=newGid();
        try{await dirsPut({gid,name:dh.name||'Ordner',handle:dh});}catch{}  // store the folder handle for one-grant resume
        await walkDir(dh,gid);
        return;
      }catch(err){if(err&&err.name==='AbortError')return;/* fall through to input */}
    }
    dzDir.click();   // webkitdirectory <input>: open explorer, pick one folder, all files included
  }

  // ── Resume after refresh / browser restart ──
  function pickOne(){return new Promise(res=>{const inp=document.createElement('input');inp.type='file';inp.onchange=()=>res(inp.files[0]||null);inp.click();});}
  async function resumeSaved(s,chip){
    let file=null,handle=null;
    if(s.handle){
      try{
        // requestPermission directly: returns 'granted' without a prompt if
        // already granted, else prompts. Calling queryPermission first and
        // awaiting it can consume the click's user-activation and make the
        // prompt throw — which then wrongly fell back to re-selecting the file.
        const perm=await s.handle.requestPermission({mode:'read'});
        if(perm==='granted'){file=await s.handle.getFile();handle=s.handle;}
      }catch(e){console.error('handle',e);}
    }
    if(!file)file=await pickOne();   // re-select fallback: no live handle to keep
    if(!file)return;
    if(fpOf(file)!==s.fp){await showModal(t('m.diffTitle'),t('m.diffMsg'),t('close'),false);return;}
    chip.remove();
    await enqueue(file,handle,true);   // resumed=true → skip the redundant dedup re-hash
  }
  function mkChip(label,pct,title){
    const chip=document.createElement('div');chip.className='resume-chip';
    chip.innerHTML=`<span class="rc-name" title="${esc(title||label)}">${esc(label)}</span><span class="rc-pct">${pct}% · ${esc(t('resume'))}</span>`;
    return chip;
  }
  async function refreshResumeChips(){
    resumeBar.innerHTML='';
    let saved=[],dirs=[];try{saved=await jobAll();dirs=await dirsAll();}catch{return;}
    // probe the server offset for each saved (not-active) job; keep resumable ones
    const live=[];
    for(const s of saved){
      if(jobs.has(s.fp))continue;
      let off=0,exists=true,reachable=true;
      try{const h=await fetch('/uploads/'+s.uploadId,{method:'HEAD'});if(h.status===404)exists=false;else if(h.ok)off=parseInt(h.headers.get('Upload-Offset'))||0;else reachable=false;}catch{reachable=false;}
      if(!reachable)continue;                       // transient error — don't show a bogus 0% chip; retry next refresh
      if(!exists||off>=s.size){await jobDel(s.fp);continue;}
      s._off=off;live.push(s);
    }
    // group folder jobs by gid; everything else is an individual file
    const groups=new Map(),singles=[];
    for(const s of live){if(s.gid){if(!groups.has(s.gid))groups.set(s.gid,[]);groups.get(s.gid).push(s);}else singles.push(s);}
    const dirMap=new Map(dirs.map(d=>[d.gid,d]));
    // ONE chip per folder → resumes the whole folder with a single permission grant
    for(const [gid,group] of groups){
      const d=dirMap.get(gid);
      const total=group.reduce((a,s)=>a+s.size,0),done=group.reduce((a,s)=>a+s._off,0);
      const pct=total>0?Math.round(done/total*100):0;
      const nm=(d&&d.name)||'Ordner';
      const chip=mkChip(`📁 ${nm} (${group.length})`,pct,nm);
      chip.onclick=()=>resumeFolder(gid,d,group,chip);
      resumeBar.appendChild(chip);
    }
    // one chip per individually-picked file
    for(const s of singles){
      const pct=s.size>0?Math.round(s._off/s.size*100):0;
      const chip=mkChip(s.name,pct);
      chip.onclick=()=>resumeSaved(s,chip);
      resumeBar.appendChild(chip);
    }
    // GC folder records whose jobs are all gone
    for(const d of dirs){if(!groups.has(d.gid))await dirsDel(d.gid);}
  }
  async function resumeFolder(gid,d,group,chip){
    let dir=d&&d.handle;
    if(!dir){                                    // no stored handle (webkitdirectory/drag) → re-pick the folder
      if(!hasDir)return;
      try{dir=await window.showDirectoryPicker();}catch{return;}
    }else{
      try{const p=await dir.requestPermission({mode:'read'});if(p!=='granted')return;}  // direct: keeps the click gesture
      catch(e){console.error('dir perm',e);return;}
    }
    // re-walk the directory ONCE → map fp → {file,handle}; one grant covers all files
    const map=new Map();
    const walk=async dh=>{for await(const e of dh.values()){if(e.kind==='file'){try{const f=await e.getFile();map.set(fpOf(f),{file:f,handle:e});}catch{}}else if(e.kind==='directory')await walk(e);}};
    try{await walk(dir);}catch(e){console.error('rewalk',e);return;}
    chip.remove();
    for(const s of group){const m=map.get(s.fp);if(m)await enqueue(m.file,m.handle,true,gid);}  // resume each from its server offset
  }

  // ── Wiring ──
  let dragDepth=0;
  dz.addEventListener('dragenter',e=>{e.preventDefault();dragDepth++;dz.classList.add('drag');});
  dz.addEventListener('dragover',e=>e.preventDefault());
  dz.addEventListener('dragleave',()=>{if(--dragDepth<=0){dragDepth=0;dz.classList.remove('drag');}});
  dz.addEventListener('drop',async e=>{e.preventDefault();dragDepth=0;dz.classList.remove('drag');const files=await collectFiles(e.dataTransfer);for(const f of files)await enqueue(f,null);});
  // Clicking the field opens a tiny menu (a native dialog can't offer files AND
  // folders at once), so you can pick either right where you'd otherwise drag.
  const dzMenu=$('dz-menu');
  const showMenu=on=>dzMenu.classList.toggle('show', on===undefined?!dzMenu.classList.contains('show'):on);
  dz.addEventListener('click',e=>{e.stopPropagation();showMenu();});
  $('menu-files').addEventListener('click',()=>{showMenu(false);pick();});
  $('menu-folder').addEventListener('click',()=>{showMenu(false);pickFolder();});
  document.addEventListener('click',e=>{if(!e.target.closest('.dz-pick'))showMenu(false);});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')showMenu(false);});
  dzInput.addEventListener('change',()=>{[...dzInput.files].forEach(f=>enqueue(f,null));dzInput.value='';});
  dzDir.addEventListener('change',()=>{[...dzDir.files].forEach(f=>enqueue(f,null));dzDir.value='';});
  $('up-cancel').addEventListener('click',cancelAll);
  window.addEventListener('beforeunload',e=>{if([...jobs.values()].some(j=>j.state==='up'||j.state==='wait')){e.preventDefault();e.returnValue='';}});

  refreshResumeChips();
})();

</script>
</body>
