<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sign in · data ingestor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0f0f; --panel:#1f1f1f; --hover:#272727; --line:#303030;
  --text:#f1f1f1; --mute:#aaa; --dim:#717171;
  --blue:#3ea6ff; --red:#f28b82; --orange:#ffb74d;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font:14px/1.5 Inter,system-ui,sans-serif;
  display:grid;place-items:center;
  overflow:hidden;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:36px 32px 28px;
  width:340px;
  position:relative;
  box-shadow:0 24px 60px -12px rgba(0,0,0,.5);
  animation:rise .4s cubic-bezier(.2,.9,.3,1.1);
}
.card.shake{animation:shake .4s ease-in-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes shake{
  10%,90%{transform:translateX(-2px)}
  20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-6px)}
  40%,60%{transform:translateX(6px)}
}

.icon{
  width:44px;height:44px;border-radius:12px;
  background:var(--bg);
  border:1px solid var(--line);
  display:grid;place-items:center;
  margin:0 auto 18px;color:var(--blue);
}
.icon svg{width:22px;height:22px}

h1{font-size:18px;font-weight:600;text-align:center;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:13px;text-align:center;margin-top:4px;margin-bottom:24px}

.field{position:relative}
.field input{
  width:100%;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:8px;
  padding:12px 16px;
  color:var(--text);
  font:500 15px/1 Inter,sans-serif;
  transition:border-color .15s, background .15s;
}
.field input::placeholder{font-weight:400;color:var(--dim)}
.field input:focus{outline:0;border-color:var(--blue);background:var(--bg)}
.field input:focus + .glow{opacity:1}
.glow{
  position:absolute;inset:-1px;border-radius:9px;
  box-shadow:0 0 0 3px rgba(62,166,255,.12);
  pointer-events:none;opacity:0;transition:opacity .2s;
}

button[type=submit]{
  width:100%;margin-top:14px;
  background:var(--blue);
  border:0;color:#000;
  padding:13px;border-radius:999px;
  font:600 14px Inter,sans-serif;
  cursor:pointer;
  transition:transform .1s, background .15s;
}
button[type=submit]:hover{background:#5fb6ff}
button[type=submit]:active{transform:translateY(1px)}
button[type=submit]:disabled{background:#1a3a5c;color:#4a7aaa;cursor:not-allowed}

.err{
  margin-top:14px;
  border-radius:7px;
  font-size:13px;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 12px;
}
.err.red{
  background:rgba(242,139,130,.08);
  border:1px solid rgba(242,139,130,.2);
  color:var(--red);
}
.err.orange{
  background:rgba(255,183,77,.08);
  border:1px solid rgba(255,183,77,.2);
  color:var(--orange);
}
.err svg{width:14px;height:14px;flex-shrink:0}

.foot{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:11px;color:var(--dim)}

.lang{position:fixed;top:18px;right:18px;z-index:10}
.lang-btn{
  display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:15px;
  background:var(--panel);border:1px solid var(--line);color:var(--mute);
  cursor:pointer;font:500 12px Inter,system-ui,sans-serif;transition:all .15s;
}
.lang-btn:hover{background:var(--hover);color:var(--text)}
.lang-btn .globe{width:14px;height:14px;opacity:.85;flex-shrink:0}
.lang-btn .chev{width:12px;height:12px;opacity:.6;transition:transform .15s;flex-shrink:0}
.lang.open .lang-btn{border-color:var(--blue);color:var(--text)}
.lang.open .lang-btn .chev{transform:rotate(180deg)}
.lang-menu{
  position:absolute;top:calc(100% + 6px);right:0;min-width:140px;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);overflow:hidden;display:none;flex-direction:column;
}
.lang.open .lang-menu{display:flex}
.lang-menu button{
  background:none;border:0;color:var(--text);font:inherit;font-size:13px;cursor:pointer;
  text-align:left;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.lang-menu button:hover{background:var(--hover)}
.lang-menu button.active{color:var(--blue)}
.lang-menu button .check{width:14px;height:14px;opacity:0;flex-shrink:0}
.lang-menu button.active .check{opacity:1}

</style>
</head>
<body>
<div class="lang" id="lang">
  <button class="lang-btn" id="lang-btn" type="button" title="Sprache / Language" aria-haspopup="true">
    <svg class="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    <span id="lang-cur">Deutsch</span>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
  </button>
  <div class="lang-menu" id="lang-menu" role="listbox">
    <button data-lang="de" type="button">Deutsch<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>
    <button data-lang="en" type="button">English<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>
  </div>
</div>
{% set locked = error == "locked" %}
<form class="card{% if error and not locked %} shake{% endif %}"
      method="post" action="/login" autocomplete="off">
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
  </div>
  <h1 data-i18n="title">Anmeldung</h1>
  <div class="sub" data-i18n="sub">Passwort eingeben</div>

  <div class="field">
    <input type="password" name="password"
           autocomplete="current-password" autofocus
           placeholder="Passwort" data-i18n-ph="pw"
           {% if locked %}disabled{% endif %}>
    <span class="glow"></span>
  </div>

  <button type="submit" {% if locked %}disabled{% endif %} data-i18n="signin">Anmelden</button>

  {% if error == "1" %}
  <div class="err red">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span data-i18n="wrong">Falsches Passwort. Erneut versuchen.</span>
  </div>
  {% elif locked %}
  <div class="err orange">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="13"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span data-i18n="locked">Zu viele Versuche — erneut in</span>
    <span id="cd">{{ request.query_params.get('wait', '300') }}s</span>
  </div>
  <script>
    const el = document.getElementById('cd');
    let s = parseInt(el.textContent);
    const t = setInterval(() => {
      s--;
      if (s <= 0) { clearInterval(t); location.href='/login'; return; }
      el.textContent = s + 's';
    }, 1000);
  </script>
  {% endif %}
</form>
<div class="foot" data-i18n="foot">Sichere Übertragung · Inhalte werden nicht angezeigt</div>
<script>

(function(){
  var LANG_NAMES={de:'Deutsch',en:'English'};
  var S={de:{title:'Anmeldung',sub:'Passwort eingeben',pw:'Passwort',signin:'Anmelden',
             wrong:'Falsches Passwort. Erneut versuchen.',locked:'Zu viele Versuche — erneut in',
             foot:'Sichere Übertragung · Inhalte werden nicht angezeigt'},
         en:{title:'Authentication',sub:'Enter the password to continue',pw:'Password',signin:'Sign in',
             wrong:'Incorrect password. Try again.',locked:'Too many attempts — try again in',
             foot:'Secure transfer · contents are never shown'}};
  var lang=localStorage.getItem('lang')||'de';
  function apply(){
    var d=S[lang]||S.de;
    document.documentElement.lang=lang;
    document.querySelectorAll('[data-i18n]').forEach(function(el){if(d[el.dataset.i18n])el.textContent=d[el.dataset.i18n];});
    document.querySelectorAll('[data-i18n-ph]').forEach(function(el){if(d[el.dataset.i18nPh])el.placeholder=d[el.dataset.i18nPh];});
    var cur=document.getElementById('lang-cur');if(cur)cur.textContent=LANG_NAMES[lang];
    document.querySelectorAll('#lang-menu button').forEach(function(b){b.classList.toggle('active',b.dataset.lang===lang);});
  }
  apply();
  var langEl=document.getElementById('lang');
  document.getElementById('lang-btn').addEventListener('click',function(e){e.stopPropagation();langEl.classList.toggle('open');});
  document.querySelectorAll('#lang-menu button').forEach(function(b){b.addEventListener('click',function(){lang=b.dataset.lang;localStorage.setItem('lang',lang);langEl.classList.remove('open');apply();});});
  document.addEventListener('click',function(e){if(!e.target.closest('#lang'))langEl.classList.remove('open');});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')langEl.classList.remove('open');});
})();
</script>
</body>
</html>
