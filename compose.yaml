services:
  ingestor:
    image: ghcr.io/antndev/data-injector:latest
    container_name: ingestor
    restart: unless-stopped
    expose:
      - "8000"
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - ./db:/db
      - openwebui_openwebui_data:/openwebui-data # important!
    networks:
      - proxy
      - openwebui_rag-internal

networks:
  proxy:
    external: true
  openwebui_rag-internal:
    external: true

volumes:
  openwebui_openwebui_data:
    external: true
